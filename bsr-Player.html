<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no" />
    <title>BSR Pro Generator - المولد الشامل</title>
    <link rel="icon" type="image/jpg" href="https://up6.cc/2026/04/177672181699171.jpg">

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />

    <style>
        :root {
            --bg-body: #090e17;
            --bg-card: #111827;
            --bg-input: #1f2937;
            --primary: #00e5ff;
            --primary-hover: #00c6dd;
            --secondary: #8b5cf6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
            --success: #10b981;
            --danger: #ef4444;
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Tajawal", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 0%, rgba(139, 92, 246, 0.15), transparent 25%), 
                radial-gradient(circle at 85% 100%, rgba(0, 229, 255, 0.15), transparent 25%);
            background-attachment: fixed;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* --- Header & Navbar --- */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .telegram-banner {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: linear-gradient(90deg, #0088cc, #00aaff);
            color: white;
            text-decoration: none;
            padding: 10px;
            font-size: 14px;
            font-weight: 700;
            transition: var(--transition);
        }
        .telegram-banner:hover { filter: brightness(1.1); }

        .navbar {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
        }

        .brand-text {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(to left, #fff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Layout --- */
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            opacity: 0.5;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .card-header i {
            font-size: 22px;
            color: var(--primary);
        }

        .card-header h2 {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
        }

        /* --- Forms --- */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
        }
        @media (min-width: 768px) {
            .form-grid { grid-template-columns: 1fr 1fr; }
            .full { grid-column: span 2; }
        }

        .input-group {
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .input-group i {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 16px;
            pointer-events: none;
            transition: var(--transition);
        }
        
        input, select, textarea {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid #374151;
            border-radius: var(--radius-md);
            padding: 15px 45px 15px 15px;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            outline: none;
            appearance: none;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
            padding-top: 15px;
        }

        .input-group textarea ~ i {
            top: 25px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            background: #111827;
            box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.15);
        }

        input:focus ~ i, select:focus ~ i, textarea:focus ~ i {
            color: var(--text-main);
        }

        /* --- Buttons --- */
        button {
            padding: 15px 24px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: var(--transition);
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--secondary), #3B82F6);
            color: white;
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4); }

        .btn-secondary {
            background: var(--bg-input);
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        .btn-secondary:hover { background: rgba(0, 229, 255, 0.1); transform: translateY(-2px); }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        }
        .btn-success:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            width: auto;
            padding: 8px 16px;
        }
        .btn-danger:hover { background: var(--danger); color: white; }

        /* --- Server List --- */
        .server-item {
            background: var(--bg-input);
            border-radius: var(--radius-md);
            padding: 18px;
            margin-bottom: 15px;
            border: 1px solid #374151;
            transition: var(--transition);
            animation: fadeIn 0.4s ease forwards;
        }
        .server-item:hover { border-color: var(--secondary); transform: translateX(-5px); }

        .server-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .server-title {
            font-weight: 800;
            color: white;
            font-size: 16px;
        }

        .server-url {
            direction: ltr;
            text-align: left;
            font-size: 13px;
            color: var(--text-muted);
            background: #111827;
            padding: 10px;
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
            word-break: break-all;
            font-family: monospace;
            border: 1px solid #374151;
        }

        .tags { display: flex; gap: 8px; flex-wrap: wrap; }
        
        .tag {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .tag.mode { background: rgba(0, 229, 255, 0.15); color: var(--primary); }
        .tag.drm { background: rgba(139, 92, 246, 0.15); color: var(--secondary); }

        /* --- Results Area --- */
        .result-box {
            background: rgba(31, 41, 55, 0.5);
            border: 2px dashed #374151;
            border-radius: var(--radius-md);
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 16px;
            font-weight: 500;
        }

        .code-block { margin-bottom: 20px; }
        .code-block label { display: block; margin-bottom: 8px; font-weight: 700; color: var(--primary); }
        
        textarea.code {
            height: 100px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            background: #000;
            border-color: #374151;
            color: #a78bfa;
            padding: 15px;
            direction: ltr;
            text-align: left;
            border-radius: var(--radius-md);
        }

        /* --- Toast Notification --- */
        .toast {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(-150px);
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 700;
            z-index: 9999;
            transition: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--success);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast i { font-size: 18px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="sticky-header">
        <a href="https://t.me/Basritv" target="_blank" class="telegram-banner">
            <i class="fab fa-telegram-plane"></i> انضم لقناتنا للحصول على التحديثات
        </a>
        <div class="navbar">
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-play"></i></div>
                <div class="brand-text">BSR PRO GENERATOR</div>
            </div>
        </div>
    </div>

    <div class="container">
        
        <!-- Section 1: Server Inputs -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-server"></i>
                <h2>بيانات السيرفر / القناة</h2>
            </div>
            <div class="form-grid">
                <div class="input-group">
                    <input id="serverName" placeholder="اسم القناة" />
                    <i class="fas fa-tv"></i>
                </div>
                <div class="input-group">
                    <input id="serverUrl" placeholder="رابط البث المباشر (URL)" />
                    <i class="fas fa-link"></i>
                </div>
                
                <div class="input-group">
                    <select id="playerMode">
                        <option value="EXO">Exo Player</option>
                        <option value="WEB">Web Player</option>
                        <option value="WEB2EXO">Web To Exo</option>
                        <option value="JSON">JSON Resolver</option>
                        <option value="M3U">M3U Playlist</option>
                        <option value="BROWSER">External Browser</option>
                        <option value="IFRAME">Iframe Mode</option>
                    </select>
                    <i class="fas fa-play-circle"></i>
                </div>
                
                <div class="input-group">
                    <select id="drmType">
                        <option value="None">بدون تشفير (No DRM)</option>
                        <option value="WIDEVINE">Widevine</option>
                        <option value="CLEARKEY">ClearKey</option>
                        <option value="PLAYREADY">PlayReady</option>
                    </select>
                    <i class="fas fa-shield-alt"></i>
                </div>

                <div class="input-group full">
                    <input id="drmKey" placeholder="مفتاح التشفير DRM Key (KID:KEY)" />
                    <i class="fas fa-key"></i>
                </div>
                <div class="input-group full">
                    <input id="drmLicense" placeholder="رابط الترخيص License URL (اختياري)" />
                    <i class="fas fa-certificate"></i>
                </div>
                
                <div class="input-group">
                    <input id="userAgent" placeholder="User-Agent (اختياري)" />
                    <i class="fas fa-user-secret"></i>
                </div>
                <div class="input-group">
                    <input id="referer" placeholder="Referer (اختياري)" />
                    <i class="fas fa-globe"></i>
                </div>
                <div class="input-group">
                    <input id="origin" placeholder="Origin (اختياري)" />
                    <i class="fas fa-code-branch"></i>
                </div>
                <div class="input-group">
                    <input id="cookie" placeholder="Cookie (اختياري)" />
                    <i class="fas fa-cookie-bite"></i>
                </div>

                <div class="full" style="margin-top: 10px;">
                    <button class="btn-secondary" onclick="addServer()">
                        <i class="fas fa-plus"></i> إضافة إلى القائمة
                    </button>
                </div>
            </div>
        </div>

        <!-- Section 2: Global Settings -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-cogs"></i>
                <h2>إعدادات المظهر والحماية (عامة)</h2>
            </div>
            <div class="form-grid">
                <div class="input-group full">
                    <input id="logoUrl" placeholder="رابط شعار القناة Logo URL (اختياري)" />
                    <i class="fas fa-image"></i>
                </div>
                <div class="input-group">
                    <select id="logoPosition">
                        <option value="top_right">أعلى اليمين</option>
                        <option value="top_left">أعلى اليسار</option>
                        <option value="bottom_right" selected>أسفل اليمين</option>
                        <option value="bottom_left">أسفل اليسار</option>
                    </select>
                    <i class="fas fa-location-arrow"></i>
                </div>
                <div class="input-group">
                    <select id="logoAlpha">
                        <option value="1.0">وضوح كامل (100%)</option>
                        <option value="0.8" selected>شبه شفاف (80%)</option>
                        <option value="0.5">شفاف (50%)</option>
                        <option value="0.3">خفيف جداً (30%)</option>
                    </select>
                    <i class="fas fa-ghost"></i>
                </div>

                <div class="input-group full">
                    <select id="vpnEnabled">
                        <option value="true" selected>تفعيل حظر الـ VPN</option>
                        <option value="false">إيقاف حظر الـ VPN</option>
                    </select>
                    <i class="fas fa-user-shield"></i>
                </div>
                <div class="input-group">
                    <input id="vpnTitle" value="تحذير أمني" placeholder="عنوان رسالة الـ VPN" />
                    <i class="fas fa-heading"></i>
                </div>
                <div class="input-group">
                    <input id="vpnExit" value="خروج" placeholder="نص زر الخروج" />
                    <i class="fas fa-sign-out-alt"></i>
                </div>
                <div class="input-group full">
                    <textarea id="vpnMsg" placeholder="نص رسالة الـ VPN">يرجى إيقاف الـ VPN حتى يعمل المشغل بشكل صحيح.</textarea>
                    <i class="fas fa-comment-dots"></i>
                </div>

                <div class="full" style="margin-top: 15px;">
                    <button class="btn-primary" onclick="generate()">
                        <i class="fas fa-bolt"></i> توليد الروابط النهائية
                    </button>
                </div>
            </div>
        </div>

        <!-- Section 3: List -->
        <div class="card">
            <div class="card-header" style="justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <i class="fas fa-list-ul"></i>
                    <h2>القائمة المضافة (<span id="serverCount">0</span>)</h2>
                </div>
                <button class="btn-danger" onclick="clearAll()">
                    <i class="fas fa-trash-alt"></i> مسح الكل
                </button>
            </div>
            <div id="list">
                <!-- القائمة تظهر هنا -->
            </div>
        </div>

        <!-- Section 4: Results -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-code"></i>
                <h2>النتائج النهائية</h2>
            </div>
            <div id="resultBox" class="result-box">
                <i class="fas fa-box-open" style="font-size: 40px; margin-bottom: 15px; color: #374151;"></i>
                <p>قم بإضافة بيانات السيرفر واضغط على "توليد الروابط" لتظهر النتائج هنا.</p>
            </div>
            
            <div id="resultContent" style="display:none">
                <div class="code-block">
                    <label><i class="fas fa-link"></i> رابط Intent (للتشغيل المباشر في التطبيق):</label>
                    <textarea id="intentOut" class="code" readonly></textarea>
                    <button class="btn-success" style="margin-top:10px" onclick="copy('intentOut', this)">
                        <i class="fas fa-copy"></i> نسخ الرابط
                    </button>
                </div>
                
                <div class="code-block">
                    <label><i class="fab fa-html5"></i> كود HTML (زر جاهز لموقعك):</label>
                    <textarea id="htmlOut" class="code" readonly></textarea>
                    <button class="btn-secondary" style="margin-top:10px" onclick="copy('htmlOut', this)">
                        <i class="fas fa-copy"></i> نسخ كود HTML
                    </button>
                </div>
            </div>
        </div>

        <!-- Section 5: Decode -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-unlock-alt"></i>
                <h2>تفكيك / استرجاع بيانات رابط سابق</h2>
            </div>
            <div class="input-group">
                <textarea id="decodeIn" placeholder="الصق رابط Intent هنا لاسترجاع كافة الحقول والتعديل عليها..."></textarea>
                <i class="fas fa-magic" style="top: 25px;"></i>
            </div>
            <button class="btn-secondary" style="margin-top:15px" onclick="decode()">
                <i class="fas fa-sync-alt"></i> استخراج واسترجاع البيانات
            </button>
        </div>
        
    </div>

    <script>
        let servers = [];
        const ids = ["serverName", "serverUrl", "playerMode", "drmType", "drmKey", "drmLicense", "userAgent", "referer", "origin", "cookie"];
        const settingsIds = ["logoUrl", "logoPosition", "logoAlpha", "vpnEnabled", "vpnTitle", "vpnExit", "vpnMsg"];

        function addServer() {
            const data = {};
            ids.forEach(id => data[id] = document.getElementById(id).value.trim());
            
            if(!data.serverName || !data.serverUrl) {
                return toast("يرجى إدخال اسم القناة ورابط البث على الأقل", "error");
            }
            
            servers.push(data); 
            render();
            
            // إفراغ الحقول الأساسية فقط لسهولة إضافة قناة أخرى
            document.getElementById('serverName').value = ""; 
            document.getElementById('serverUrl').value = "";
            document.getElementById('serverName').focus();
            
            toast("تمت الإضافة إلى القائمة بنجاح");
        }

        function render() {
            const list = document.getElementById('list');
            document.getElementById('serverCount').innerText = servers.length;
            
            if(servers.length === 0) {
                list.innerHTML = `<p style="text-align:center; color:var(--text-muted); font-size:14px; padding:20px;">القائمة فارغة حالياً</p>`;
                return;
            }

            list.innerHTML = servers.map((s, i) => `
                <div class="server-item">
                    <div class="server-top">
                        <span class="server-title"><i class="fas fa-tv" style="color:var(--primary); margin-left:8px;"></i>${s.serverName}</span>
                        <button class="btn-danger" onclick="remove(${i})"><i class="fas fa-times"></i> حذف</button>
                    </div>
                    <div class="server-url">${s.serverUrl}</div>
                    <div class="tags">
                        <span class="tag mode"><i class="fas fa-play"></i> ${s.playerMode}</span>
                        <span class="tag drm"><i class="fas fa-shield-alt"></i> DRM: ${s.drmType}</span>
                    </div>
                </div>`).join('');
        }

        function remove(i) { 
            servers.splice(i, 1); 
            render(); 
            toast("تم حذف السيرفر");
        }

        function clearAll() { 
            if(servers.length === 0) return;
            if(confirm("هل أنت متأكد من مسح جميع السيرفرات المضافة؟")){
                servers = []; 
                render(); 
                document.getElementById('resultContent').style.display = "none"; 
                document.getElementById('resultBox').style.display = "block"; 
                toast("تم مسح القائمة بالكامل");
            }
        }

        function generate() {
            if(!servers.length) return toast("يرجى إضافة سيرفر واحد على الأقل أولاً", "error");
            
            const config = { servers: servers, settings: {} };
            settingsIds.forEach(id => config.settings[id] = document.getElementById(id).value);
            
            const data = btoa(unescape(encodeURIComponent(JSON.stringify(config))));
            const intent = `intent://play?data=${encodeURIComponent(data)}#Intent;scheme=BSRPlayer;package=com.bsr.player.pro;end`;
            
            document.getElementById('intentOut').value = intent;
            document.getElementById('htmlOut').value = `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<!-- استدعاء خط عربي احترافي -->
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">

<style>
    /* منع تحديد النصوص والنسخ لحماية المحتوى */
    * {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        box-sizing: border-box;
    }

    body { 
        margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; 
        background: #030614; overflow: hidden; font-family: 'Tajawal', sans-serif; 
    }

    /* خلفية متحركة واحترافية */
    .bg { 
        position: fixed; inset: 0; z-index: -1;
        background: radial-gradient(circle at center, #1a153a 0%, #030614 100%);
    }
    .bg::after {
        content: ''; position: absolute; inset: 0;
        background-image: linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
        background-size: 30px 30px; opacity: 0.5;
    }

    /* تأثير النبض خلف زر التشغيل */
    .play-wrapper { position: relative; display: flex; justify-content: center; align-items: center; }
    .ring { 
        position: absolute; width: 110px; height: 110px; border-radius: 50%; 
        border: 2px solid #00E5FF; animation: ripple 2.5s infinite ease-out; opacity: 0; 
    }
    .ring:nth-child(2) { animation-delay: 0.8s; border-color: #FF007A; }
    .ring:nth-child(3) { animation-delay: 1.6s; border-color: #7C3AED; }
    
    @keyframes ripple { 
        0% { transform: scale(1); opacity: 0.8; } 
        100% { transform: scale(3); opacity: 0; } 
    }
    
    /* زر التشغيل الرئيسي (تصميم نيون متحرك) */
    .play-btn { 
        position: relative; width: 100px; height: 100px; border-radius: 50%; border: none; cursor: pointer; 
        background: linear-gradient(45deg, #FF007A, #7C3AED, #00E5FF, #FF007A); background-size: 300% 300%;
        animation: gradientMove 4s ease infinite;
        color: white; font-size: 40px; display: flex; justify-content: center; align-items: center; 
        padding-left: 8px; box-shadow: 0 0 40px rgba(124, 58, 237, 0.6); z-index: 10; transition: 0.3s;
    }
    .play-btn:active { transform: scale(0.9); box-shadow: 0 0 20px rgba(0, 229, 255, 0.8); }

    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    
    /* النافذة المنبثقة (تصميم زجاجي - Glassmorphism) */
    .popup { 
        position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); 
        -webkit-backdrop-filter: blur(15px); display: none; justify-content: center; align-items: center; z-index: 9999; 
    }
    
    .popup-box { 
        background: rgba(17, 24, 39, 0.7); border: 1px solid rgba(0, 229, 255, 0.3); padding: 40px 30px; 
        border-radius: 30px; width: 90%; max-width: 380px; text-align: center; color: white; 
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 229, 255, 0.1); 
        transform: scale(0.5); opacity: 0; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
    }
    
    @keyframes popIn {
        to { transform: scale(1); opacity: 1; }
    }

    .popup-box h2 { 
        margin: 0; color: #fff; font-size: 26px; font-weight: 900; 
        text-shadow: 0 0 15px rgba(0, 229, 255, 0.8); 
    }
    
    .popup-box p { 
        margin-top: 15px; color: #A1A1AA; line-height: 1.8; font-size: 15px; font-weight: 500; 
    }
    
    /* زر التحميل */
    .download-btn { 
        margin-top: 25px; padding: 16px; border: none; border-radius: 16px; width: 100%; font-size: 18px; 
        font-weight: 700; font-family: 'Tajawal', sans-serif; cursor: pointer; 
        background: linear-gradient(90deg, #00E5FF, #7C3AED); color: white; 
        box-shadow: 0 10px 25px rgba(124, 58, 237, 0.4); transition: 0.3s;
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    .download-btn:active { transform: translateY(3px); box-shadow: 0 5px 10px rgba(124, 58, 237, 0.4); }

    /* أيقونة التحذير */
    .icon-warn {
        font-size: 50px; margin-bottom: 10px; display: block; text-shadow: 0 0 20px rgba(255, 0, 122, 0.8);
    }
</style>
</head>

    // تعطيل كليك يمين

    // تعطيل سحب الصور والعناصر
    document.addEventListener('dragstart', event => event.preventDefault());

    // تعطيل اختصارات لوحة المفاتيح للمطورين (F12, Ctrl+U, Ctrl+Shift+I)
    document.onkeydown = function(e) {
        if(e.keyCode == 123) return false; // F12
        if(e.ctrlKey && e.shiftKey && e.keyCode == 73) return false; // I
        if(e.ctrlKey && e.shiftKey && e.keyCode == 74) return false; // J
        if(e.ctrlKey && e.keyCode == 85) return false; // U
        if(e.ctrlKey && e.keyCode == 67) return false; // C
    };

        function toast(msg, type="success") {
            // إزالة أي توست سابق
            const existing = document.querySelector('.toast');
            if(existing) existing.remove();

            const t = document.createElement("div");
            t.className = "toast show";
            
            if(type === "error") {
                t.style.borderColor = "var(--danger)";
                t.innerHTML = `<i class="fas fa-exclamation-circle" style="color:var(--danger)"></i> ${msg}`;
            } else {
                t.style.borderColor = "var(--success)";
                t.innerHTML = `<i class="fas fa-check-circle" style="color:var(--success)"></i> ${msg}`;
            }
            
            document.body.appendChild(t);
            setTimeout(() => { 
                t.classList.remove("show");

            }, 3000);
