name: Sync Firebase to GitHub Static Data
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: firebase-static-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build static catalog from Firebase
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: node scripts/sync-firebase.mjs
      - name: Commit only when data changed
        run: |
          if git diff --quiet; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "BSR Firebase Sync"
          git config user.email "actions@users.noreply.github.com"
          git add app/data/sections.json app/data/categories app/data/version.json
          git commit -m "Sync Firebase catalog to static GitHub data"
          git push
