<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>البصري بلاير</title>
<style>
:root{
  --bg:#07111d;--bg2:#091724;--card:#0d1b29;--card2:#102131;--card3:#0a1824;
  --text:#fff;--muted:#8294a5;--border:#25394c;--accent:#18d4dc;--accent-soft:rgba(24,212,220,.12);
  --bar:rgba(7,17,29,.94);--shadow:0 12px 32px rgba(0,0,0,.20);--radius:16px;
}
body.light{--bg:#f4f6f8;--bg2:#eef2f5;--card:#fff;--card2:#f5f7f9;--card3:#fff;--text:#17212b;--muted:#71808d;--border:#d9e0e6;--accent:#078d9b;--accent-soft:rgba(7,141,155,.10);--bar:rgba(255,255,255,.95);--shadow:0 10px 28px rgba(23,33,43,.09)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{direction:rtl}
body{font-family:Tahoma,Arial,sans-serif;background:
 radial-gradient(circle at 85% -10%,rgba(24,212,220,.08),transparent 28%),
 linear-gradient(180deg,var(--bg2),var(--bg));color:var(--text);min-height:100vh;padding-bottom:88px;overflow-x:hidden;transition:.2s}
body,body *{-webkit-tap-highlight-color:transparent}
body:not(.allow-select),body:not(.allow-select) *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text!important;user-select:text!important}

.header{height:68px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:8px 66px;background:var(--bar);border-bottom:1px solid rgba(120,160,190,.18);backdrop-filter:blur(18px)}
.app-name{font-size:19px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.1px}
.header-btn{position:absolute;top:11px;width:44px;height:44px;border-radius:13px;border:1px solid var(--border);background:linear-gradient(145deg,var(--card2),var(--card));color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 5px 18px rgba(0,0,0,.10)}
.menu-btn{right:11px}.search-btn{left:11px}.header-btn svg{width:22px;height:22px}
.header-btn:active{transform:scale(.96)}

.search-area{max-height:0;overflow:hidden;background:var(--bg);transition:max-height .24s ease,padding .24s ease;border-bottom:1px solid transparent}
.search-area.show{max-height:76px;padding:10px 11px;border-bottom-color:rgba(120,160,190,.12)}
.search-shell{position:relative;max-width:900px;margin:auto}
.search-input{width:100%;height:46px;border-radius:14px;border:1px solid var(--border);outline:none;background:var(--card);color:var(--text);padding:0 15px 0 44px;font-size:14px;direction:rtl;text-align:right;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-mini{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}

.content{max-width:920px;margin:auto;padding:14px 10px 22px;direction:rtl}
.sections-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;direction:rtl}
.section-card{position:relative;min-width:0;height:84px;display:flex;align-items:center;direction:rtl;gap:10px;padding:9px;border-radius:var(--radius);border:1px solid rgba(120,160,190,.24);background:linear-gradient(145deg,var(--card2),var(--card));cursor:pointer;transition:.16s;box-shadow:var(--shadow);overflow:hidden}
.section-card:before{content:"";position:absolute;right:0;top:14px;bottom:14px;width:2px;border-radius:4px;background:linear-gradient(180deg,transparent,var(--accent),transparent);opacity:.7}
.section-card:active{transform:scale(.975)}
.section-card:focus{outline:2px solid rgba(24,212,220,.40);outline-offset:-2px}
.image-box{width:56px;height:56px;flex:0 0 56px;padding:6px;border-radius:14px;display:flex;align-items:center;justify-content:center;background-color:rgba(4,13,22,.68);background-repeat:no-repeat;background-position:center;background-size:contain;border:1px solid rgba(120,160,190,.28);overflow:hidden}
.image-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:9px;background:linear-gradient(145deg,#0b3144,#0b1f2d);font-size:10px;font-weight:900;color:var(--accent)}
.section-info{flex:1;min-width:0;display:flex;align-items:center}
.section-name{width:100%;font-size:13px;text-align:right;font-weight:900;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{grid-column:1/-1;padding:48px 10px;text-align:center;color:var(--muted);font-size:13px}

.view{display:none}.view.active{display:block}
.matches-list{display:grid;gap:12px;direction:rtl}
.match-card{position:relative;border:1px solid rgba(120,160,190,.24);border-radius:18px;background:linear-gradient(145deg,var(--card2),var(--card));overflow:hidden;box-shadow:var(--shadow)}
.match-card:before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.55}
.match-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px 7px;color:var(--muted);font-size:10px}
.match-tournament{font-weight:900;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match-date{flex:none}
.match-body{display:grid;grid-template-columns:minmax(0,1fr) 104px minmax(0,1fr);align-items:center;gap:8px;padding:10px 12px 14px}
.match-team{text-align:center;min-width:0}.match-logo{width:58px;height:58px;margin:0 auto 7px;display:flex;align-items:center;justify-content:center;border-radius:15px;background:rgba(3,12,21,.26);padding:5px;border:1px solid rgba(120,160,190,.13)}
.match-logo img{max-width:100%;max-height:100%;object-fit:contain}.match-team-name{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match-center{text-align:center;min-width:0}.match-main{font-size:18px;font-weight:900;min-height:24px;display:flex;align-items:center;justify-content:center}.match-main.live-score{font-size:21px;color:#ff5d63}
.match-status{display:inline-flex;align-items:center;justify-content:center;min-width:82px;margin-top:7px;padding:6px 10px;border-radius:999px;font-size:10px;font-weight:900;border:1px solid transparent}
.match-status.upcoming{color:#35db73;background:rgba(53,219,115,.10);border-color:rgba(53,219,115,.28)}
.match-status.live{color:#ff5d63;background:rgba(255,93,99,.11);border-color:rgba(255,93,99,.30);animation:pulseLive 1.5s infinite}
.match-status.finished{color:#a4afb9;background:rgba(164,175,185,.10);border-color:rgba(164,175,185,.22)}
@keyframes pulseLive{0%,100%{box-shadow:0 0 0 0 rgba(255,93,99,0)}50%{box-shadow:0 0 0 5px rgba(255,93,99,.08)}}
.match-watch{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;padding:0 12px 13px}
.match-watch-btn{border:1px solid var(--border);background:#081522;color:var(--text);border-radius:11px;padding:8px 12px;font-size:11px;font-weight:900;cursor:pointer}
.match-watch-btn:focus,.match-watch-btn:active{outline:2px solid rgba(24,212,220,.45);color:var(--accent)}
.match-no-stream{text-align:center;color:var(--muted);font-size:10px;padding:0 12px 13px}

.bottom-nav{direction:rtl;position:fixed;left:0;right:0;bottom:0;height:76px;z-index:80;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 7px 8px;background:var(--bar);border-top:1px solid rgba(120,160,190,.18);backdrop-filter:blur(18px)}
.bottom-btn{border:0;background:transparent;color:var(--muted);border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:700;cursor:pointer;transition:.16s}
.bottom-btn.active,.bottom-btn:focus{color:var(--accent);background:var(--accent-soft);outline:1px solid rgba(24,212,220,.24)}
.nav-svg{width:22px;height:22px;display:block;fill:currentColor;flex:none}.bottom-btn.active .nav-svg{transform:translateY(-1px)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:99;opacity:0;visibility:hidden;transition:.22s;backdrop-filter:blur(2px)}.overlay.show{opacity:1;visibility:visible}
.side-menu{direction:rtl;position:fixed;top:0;right:-330px;left:auto;bottom:0;width:min(310px,88%);z-index:100;background:linear-gradient(180deg,#091826,var(--bg));border-left:1px solid var(--border);padding:0 13px 18px;transition:right .28s ease;overflow-y:auto;box-shadow:-18px 0 42px rgba(0,0,0,.30)}.side-menu.show{right:0}
.side-header{position:relative;padding:28px 8px 20px;margin-bottom:12px;border-bottom:1px solid rgba(120,160,190,.16);text-align:center}
.side-header:after{content:"";position:absolute;left:24%;right:24%;bottom:-1px;height:1px;background:var(--accent);opacity:.7}
.logo-circle{width:62px;height:62px;margin:0 auto 11px;border-radius:19px;display:flex;justify-content:center;align-items:center;background:linear-gradient(145deg,#10d6dc,#056a83);color:#fff;box-shadow:0 10px 28px rgba(24,212,220,.18)}
.logo-circle svg{width:31px;height:31px}.side-title{font-size:18px;font-weight:900}.side-title span{color:var(--accent)}.side-sub{font-size:10px;color:var(--muted);margin-top:5px;letter-spacing:.4px}
.menu-group{display:grid;gap:5px}
.menu-item{width:100%;min-height:54px;display:flex;align-items:center;gap:11px;padding:7px 9px;border:1px solid transparent;border-radius:13px;background:transparent;color:var(--text);font-size:13px;font-weight:800;text-align:right;cursor:pointer;transition:.16s}
.menu-item:active,.menu-item:focus{background:var(--card);border-color:var(--border);outline:none}
.menu-icon{width:39px;height:39px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--accent);border:1px solid var(--border)}.menu-icon svg{width:20px;height:20px}.menu-name{flex:1}
.menu-note{margin:14px 4px 0;padding:10px 11px;border:1px solid rgba(120,160,190,.14);border-radius:12px;color:var(--muted);font-size:10px;line-height:1.7;background:rgba(255,255,255,.015)}
.switch{position:relative;width:44px;height:25px;flex:none}.switch input{display:none}.slider{position:absolute;inset:0;border-radius:30px;background:#364757;transition:.2s}.slider:before{content:"";width:19px;height:19px;position:absolute;top:3px;right:3px;border-radius:50%;background:#fff;transition:.2s}.switch input:checked+.slider{background:var(--accent)}.switch input:checked+.slider:before{transform:translateX(-19px)}

@media(min-width:700px){.sections-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:420px){.match-body{grid-template-columns:minmax(0,1fr) 88px minmax(0,1fr);gap:5px;padding-inline:8px}.match-logo{width:49px;height:49px}.match-team-name{font-size:12px}.match-main{font-size:15px}.match-main.live-score{font-size:19px}.match-status{min-width:72px;padding:5px 7px;font-size:10px}}
@media(max-width:370px){.section-card{height:78px;padding:7px}.image-box{width:49px;height:49px;flex-basis:49px}.section-name{font-size:12px}}
</style>
</head>
<body>
<header class="header">
<button class="header-btn menu-btn" id="menuBtn" aria-label="القائمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
<div class="app-name" id="appName">البصري بلاير</div>
<button class="header-btn search-btn" id="searchBtn" aria-label="بحث"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
</header>
<div class="search-area" id="searchArea"><div class="search-shell"><input id="searchInput" class="search-input" type="search" placeholder="ابحث عن قسم..." autocomplete="off"><svg class="search-mini" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></div></div>

<main class="content">
<section class="view active" id="channelsView">
  <div class="sections-grid" id="sectionsGrid"><div class="empty">جاري تحميل الأقسام...</div></div>
</section>
<section class="view" id="matchesView">
  <div class="matches-list" id="matchesList"><div class="empty">جاري تحميل المباريات...</div></div>
</section>
</main>

<nav class="bottom-nav">
<button class="bottom-btn active" data-menu="home" id="navHome"><svg class="nav-svg" viewBox="0 -960 960 960"><path d="m380-340 280-180-280-180v360Zm-60 220v-80H160q-33 0-56.5-23.5T80-280v-480q0-33 23.5-56.5T160-840h640q33 0 56.5 23.5T880-760v480q0 33-23.5 56.5T800-200H640v80H320Z"/></svg><span>القنوات</span></button>
<button class="bottom-btn" data-menu="matches"><svg class="nav-svg" viewBox="0 -960 960 960" aria-hidden="true"><path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm200-500 54-18 16-54q-32-48-77-82.5T574-786l-54 38v56l160 112Zm-400 0 160-112v-56l-54-38q-54 17-99 51.5T210-652l16 54 54 18Zm-42 308 46-4 30-54-58-174-56-20-40 30q0 65 18 118.5T238-272Zm293 108q25-4 49-12l28-60-26-44H378l-26 44 28 60q24 8 49 12t51 4q26 0 51-4ZM390-360h180l56-160-146-102-144 102 54 160Zm332 88q42-50 60-103.5T800-494l-40-28-56 18-58 174 30 54 46 4Z"/></svg><span>المباريات</span></button>
<button class="bottom-btn" data-menu="movies"><svg class="nav-svg" viewBox="0 -960 960 960"><path d="m160-800 80 160h120l-80-160h80l80 160h120l-80-160h80l80 160h120l-80-160h120q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800Zm0 240v320h640v-320H160Z"/></svg><span>مسلسلات وأفلام</span></button>
<button class="bottom-btn" data-menu="sportsNews"><svg class="nav-svg" viewBox="0 -960 960 960"><path d="M160-120q-33 0-56.5-23.5T80-200v-640l67 67 66-67 67 67 67-67 66 67 67-67 67 67 66-67 67 67 67-67 66 67 67-67v640q0 33-23.5 56.5T800-120H160Z"/></svg><span>أخبار الرياضة</span></button>
</nav>

<div class="overlay" id="overlay"></div>
<aside class="side-menu" id="sideMenu">
  <div class="side-header">
    <div class="logo-circle"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
    <div class="side-title"><span>البصري</span> بلاير</div>
    <div class="side-sub">LIVE • SPORTS • ENTERTAINMENT</div>
  </div>
  <div class="menu-group">
    <button class="menu-item" data-menu="home"><span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span><span class="menu-name">الرئيسية</span></button>
    <button class="menu-item" data-menu="matches"><span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m8 9 4-2 4 2 1 4-3 3h-4l-3-3z"/><path d="M12 7V3M7 13l-4 1m14-1 4 1m-8 2 2 4m-6-4-2 4"/></svg></span><span class="menu-name">المباريات</span></button>
    <button class="menu-item" data-menu="telegram"><span class="menu-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3 3.8 9.6c-1.2.5-1.2 1.2-.2 1.5l4.4 1.4 1.7 5.1c.2.6.1.8.8.8.5 0 .8-.2 1-.4l2.1-2 4.4 3.2c.8.5 1.4.3 1.6-.8L22.4 5c.3-1.4-.5-2-1.4-1.6z"/></svg></span><span class="menu-name">قناة التليجرام</span></button>
    <button class="menu-item" data-menu="privacy"><span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 5 6v5c0 4.6 2.8 8 7 10 4.2-2 7-5.4 7-10V6z"/><path d="m9 12 2 2 4-4"/></svg></span><span class="menu-name">سياسة الخصوصية</span></button>
    <label class="menu-item"><span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></svg></span><span class="menu-name">الوضع الليلي</span><span class="switch"><input type="checkbox" id="themeSwitch" checked><span class="slider"></span></span></label>
  </div>
  <div class="menu-note">واجهة محسّنة للهواتف والشاشات مع تحديث سريع للبيانات.</div>
</aside>

<script>
const RAW_MAIN="https://raw.githubusercontent.com/albasritv/albasritv.github.io/main/app/data/";
const RAW_LIVE="https://raw.githubusercontent.com/albasritv/albasritv.github.io/live-data/app/data/";
const LIVE_API="https://bsr-sync.malikalbasri250.workers.dev";
let APP={menu:{},sections:[],matches:[],liveCatalog:null},CURRENT_VIEW="home",LAST_VERSION=0;
const q=id=>document.getElementById(id),grid=q("sectionsGrid"),matchesList=q("matchesList"),searchInput=q("searchInput");

function go(url){if(url)location.href=url}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function fallback(name){return '<span class="image-fallback">'+esc((name||"TV").slice(0,3))+'</span>'}
function sortedSections(){return (APP.sections||[]).filter(x=>x&&x.enabled!==false).slice().sort((a,b)=>(a.order??9999)-(b.order??9999))}

function renderSections(list){
  grid.innerHTML="";
  if(!list.length){grid.innerHTML='<div class="empty">لا توجد نتائج</div>';return}
  list.forEach(s=>{
    const el=document.createElement("article");el.className="section-card";el.tabIndex=0;
    const pic=document.createElement("div");pic.className="image-box";
    if(s.image)pic.style.backgroundImage='url("'+String(s.image).replace(/"/g,"%22")+'")';else pic.innerHTML=fallback(s.name);
    const info=document.createElement("div");info.className="section-info";
    const name=document.createElement("div");name.className="section-name";name.textContent=s.name||"";
    info.append(name);el.append(pic,info);
    const open=()=>go("channels-v8.html?id="+encodeURIComponent(s.id)+"&v=8");
    el.onclick=open;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}};
    grid.appendChild(el);
  });
}

function normalizeStatus(raw){
  const s=String(raw||"").trim();
  if(/جارية|مباشر|live|playing|in progress/i.test(s))return{key:"live",label:"جارية الآن"};
  if(/انتهت|finished|final|ended/i.test(s))return{key:"finished",label:"انتهت"};
  return{key:"upcoming",label:"لم تبدأ"};
}
function utf8Base64(value){const bytes=new TextEncoder().encode(value);let binary="";for(const b of bytes)binary+=String.fromCharCode(b);return btoa(binary)}

function findLiveChannel(id){
  for(const s of APP.liveCatalog?.sections||[]){const c=(s.channels||[]).find(x=>String(x.id)===String(id));if(c)return c}
  return null;
}
async function openChannel(channelId){
  const p=APP.player||{},scheme=p.scheme||"BSRPlayer",pkg=p.package||"com.bsr.player.pro";
  const fallbackUrl=encodeURIComponent(p.fallback||("https://play.google.com/store/apps/details?id="+pkg));
  try{
    let channel=findLiveChannel(channelId);
    if(!channel)channel=await fetch(RAW_MAIN+"channels/"+encodeURIComponent(channelId)+".json?t="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error();return r.json()});
    const servers=(channel.servers||[]).filter(s=>s&&s.url);if(!servers.length)throw new Error();
    const payload=servers.map((s,i)=>({name:s.name||("Server "+(i+1)),url:s.url||"",ua:s.userAgent||s.ua||"",user_agent:s.userAgent||s.user_agent||"",referer:s.referer||"",origin:s.origin||"",cookie:s.cookie||"",drmKey:s.drmKey||"",drm_key:s.drmKey||s.drm_key||"",playerMode:s.playerMode||"EXO",player_mode:s.playerMode||s.player_mode||"EXO",authorization:s.authorization||"",accept:s.accept||"",xRequestedWith:s.xRequestedWith||"",authUrl:s.authUrl||"",subtitleUrl:s.subtitleUrl||"",drmLicenseUrl:s.drmLicenseUrl||"",drmLicenseHeaders:s.drmLicenseHeaders||""}));
    const data=encodeURIComponent(utf8Base64(JSON.stringify(payload)));
    location.href="intent://servers?data="+data+"#Intent;scheme="+scheme+";package="+pkg+";S.browser_fallback_url="+fallbackUrl+";end";
  }catch(e){alert("تعذر فتح بث المباراة حالياً.")}
}

function renderMatches(list){
  matchesList.innerHTML="";
  if(!Array.isArray(list)||!list.length){matchesList.innerHTML='<div class="empty">لا توجد مباريات حالياً</div>';return}
  list.forEach(m=>{
    const st=normalizeStatus(m.status),showScore=(st.key==="live"||st.key==="finished")&&m.score;
    const mainValue=showScore?m.score:(m.baghdadTime||m.meccaTime||"--:--");
    const channels=(m.channels||[]).filter(x=>x&&x.channelId);
    const card=document.createElement("article");card.className="match-card";
    card.innerHTML='<div class="match-meta"><span class="match-tournament">'+esc(m.tournament||"مباريات اليوم")+'</span><span class="match-date">'+esc(m.sourceDate||"")+'</span></div>'+
    '<div class="match-body">'+
      '<div class="match-team"><div class="match-logo">'+(m.homeLogo?'<img src="'+esc(m.homeLogo)+'" alt="" draggable="false">':'')+'</div><div class="match-team-name">'+esc(m.homeName||"")+'</div></div>'+
      '<div class="match-center"><div class="match-main '+(showScore?"live-score":"")+'">'+esc(mainValue)+'</div><div class="match-status '+st.key+'">'+st.label+'</div></div>'+
      '<div class="match-team"><div class="match-logo">'+(m.awayLogo?'<img src="'+esc(m.awayLogo)+'" alt="" draggable="false">':'')+'</div><div class="match-team-name">'+esc(m.awayName||"")+'</div></div>'+
    '</div>'+
    (channels.length?'<div class="match-watch">'+channels.map((x,i)=>'<button class="match-watch-btn" data-channel="'+esc(x.channelId)+'">'+esc(x.channelTitle||("مشاهدة "+(i+1)))+'</button>').join("")+'</div>':'<div class="match-no-stream">لم يتم ربط بث لهذه المباراة بعد</div>');
    card.querySelectorAll("[data-channel]").forEach(b=>b.onclick=()=>openChannel(b.dataset.channel));
    matchesList.appendChild(card);
  });
}

function setActiveNav(menu){document.querySelectorAll(".bottom-btn").forEach(b=>b.classList.toggle("active",b.dataset.menu===menu))}
function closeMenu(){q("sideMenu").classList.remove("show");q("overlay").classList.remove("show")}
function showView(menu,pushHash=true){
  if(menu==="matches"){
    CURRENT_VIEW="matches";q("channelsView").classList.remove("active");q("matchesView").classList.add("active");
    q("appName").textContent="المباريات";q("searchArea").classList.remove("show");q("searchBtn").style.visibility="hidden";setActiveNav("matches");renderMatches(APP.matches||[]);
    if(pushHash&&location.hash!=="#matches")history.pushState({view:"matches"},"","#matches");
  }else{
    CURRENT_VIEW="home";q("matchesView").classList.remove("active");q("channelsView").classList.add("active");
    q("appName").textContent=APP.appName||"البصري بلاير";q("searchBtn").style.visibility="";setActiveNav("home");
    if(pushHash&&location.hash)history.pushState({view:"home"},"",location.pathname+location.search);
  }
  closeMenu();
}

async function getJson(url,fallback=null){
  try{const r=await fetch(url+(url.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});if(!r.ok)return fallback;return await r.json()}catch(e){return fallback}
}
async function refreshData(first=false){
  const [cfg,instantSections,instantMatches,liveCatalog,liveMatches,staticSections,staticMatches]=await Promise.all([
    first?getJson(RAW_MAIN+"config.json",{}):Promise.resolve(APP),
    Promise.resolve(null),
    Promise.resolve(null),
    getJson(RAW_LIVE+"catalog-live.json",null),
    CURRENT_VIEW==="matches"||first?getJson(RAW_LIVE+"matches-live.json",null):Promise.resolve(null),
    first?getJson(RAW_MAIN+"sections.json",[]):Promise.resolve(APP.sections||[]),
    first?getJson(RAW_MAIN+"matches.json",[]):Promise.resolve(APP.matches||[])
  ]);
  if(first)APP=cfg||{};

  let nextSections=null, nextVersion=0;
  if(liveCatalog&&Array.isArray(liveCatalog.sections)){
    APP.liveCatalog=liveCatalog;
    nextSections=liveCatalog.sections;
    nextVersion=Number(liveCatalog.version||0);
  }else if(first){
    nextSections=Array.isArray(staticSections)?staticSections:[];
    nextVersion=1;
  }

  if(nextSections){
    const signature=JSON.stringify(nextSections.map(s=>[s.id,s.name,s.image,s.order,s.enabled]));
    if(signature!==APP._sectionsSignature){
      APP._sectionsSignature=signature;
      APP.sections=nextSections;
      LAST_VERSION=nextVersion;
      renderSections(sortedSections());
    }
  }

  if(Array.isArray(liveMatches))APP.matches=liveMatches;
  else if(first)APP.matches=Array.isArray(staticMatches)?staticMatches:[];

  if(CURRENT_VIEW==="matches")renderMatches(APP.matches||[]);
  if(first)showView(location.hash==="#matches"?"matches":"home",false);
}

q("searchBtn").onclick=()=>{if(CURRENT_VIEW!=="home")return;q("searchArea").classList.toggle("show");if(q("searchArea").classList.contains("show"))setTimeout(()=>searchInput.focus(),100)};
searchInput.oninput=()=>{const t=searchInput.value.trim().toLowerCase(),all=sortedSections();renderSections(!t?all:all.filter(s=>(s.name||"").toLowerCase().includes(t)))};
q("menuBtn").onclick=()=>{q("sideMenu").classList.add("show");q("overlay").classList.add("show")};q("overlay").onclick=closeMenu;
document.querySelectorAll("[data-menu]").forEach(b=>b.onclick=()=>{const menu=b.dataset.menu;if(menu==="home"||menu==="matches")return showView(menu);go(APP.menu?.[menu]||"")});
window.addEventListener("popstate",()=>showView(location.hash==="#matches"?"matches":"home",false));
const theme=q("themeSwitch"),saved=localStorage.getItem("bsr-theme");if(saved==="light"){document.body.classList.add("light");theme.checked=false}
theme.onchange=()=>{document.body.classList.toggle("light",!theme.checked);localStorage.setItem("bsr-theme",theme.checked?"dark":"light")};

function protectPage(){
  const editable=e=>e.target&&/^(INPUT|TEXTAREA)$/i.test(e.target.tagName);
  ["contextmenu","dragstart"].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
  ["copy","cut","selectstart"].forEach(ev=>document.addEventListener(ev,e=>{if(!editable(e))e.preventDefault()},{passive:false}));
  document.addEventListener("keydown",e=>{
    const k=String(e.key||"").toLowerCase();
    if(e.key==="F12"||(e.ctrlKey&&["u","s"].includes(k))||(e.ctrlKey&&e.shiftKey&&["i","j","c"].includes(k))){e.preventDefault();e.stopPropagation()}
  },true);
}
protectPage();
refreshData(true);
setInterval(()=>{if(!document.hidden)refreshData(false)},1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshData(false)});
</script>
</body>
