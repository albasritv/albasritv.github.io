<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة تحكم البصري بلاير</title>
<style>
:root{--bg:#07111d;--panel:#0d1b29;--panel2:#102131;--text:#fff;--muted:#8ba0b2;--border:#263d51;--accent:#18d4dc;--danger:#ff6c77;--ok:#36d58d}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}.wrap{max-width:980px;margin:auto;padding:12px}.top{position:sticky;top:0;z-index:20;background:rgba(7,17,29,.96);backdrop-filter:blur(12px);padding:10px 0}.title{font-size:20px;font-weight:800}.sub,.hint{font-size:12px;color:var(--muted);line-height:1.7}.card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:16px;padding:13px;margin-bottom:12px}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 3px 6px}.field input{width:100%;border:1px solid var(--border);border-radius:11px;background:#081521;color:var(--text);padding:11px;outline:none}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.btn{border:1px solid var(--border);border-radius:11px;background:#0c2130;color:var(--text);padding:10px 13px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#041318;font-weight:800}.btn.danger{color:#ff9ba3;border-color:#71323a}.status{font-size:12px;color:var(--muted);margin-top:8px;min-height:18px}.status.ok{color:var(--ok)}.status.err{color:#ff9ba3}.section{border:1px solid var(--border);border-radius:14px;padding:10px;margin-top:9px;background:rgba(255,255,255,.02)}.head{display:flex;align-items:center;gap:7px}.head b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.channel{border:1px solid var(--border);border-radius:12px;padding:9px;margin-top:8px;background:#091824}.badge{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:4px 8px}@media(max-width:650px){.row{grid-template-columns:1fr}.btn{flex:1}}
</style>
</head>
<body><div class="wrap">
<div class="top">
<div class="title">لوحة تحكم البصري بلاير</div>
<div class="sub">GitHub للبيانات العامة + Cloudflare Worker للسيرفرات</div>
<div class="actions"><button class="btn" id="reload">تحديث</button><button class="btn primary" id="savePublic">حفظ البيانات العامة</button><button class="btn" id="addSection">+ قسم</button></div>
<div class="status" id="status"></div>
</div>

<div class="card">
<div class="title" style="font-size:15px">GitHub</div>
<div class="row" style="margin-top:10px">
<div class="field"><label>GitHub Token</label><input id="ghToken" type="password" autocomplete="off"></div>
<div class="field"><label>المستودع</label><input id="repo" value="albasritv/albasritv.github.io"></div>
<div class="field"><label>الفرع</label><input id="branch" value="main"></div>
<div class="field"><label>ملف البيانات</label><input id="path" value="app/data/data.json"></div>
</div></div>

<div class="card">
<div class="title" style="font-size:15px">Cloudflare Worker للسيرفرات</div>
<div class="row" style="margin-top:10px">
<div class="field"><label>Worker URL</label><input id="workerUrl" placeholder="https://...workers.dev"></div>
<div class="field"><label>Admin Key</label><input id="adminKey" type="password" autocomplete="off"></div>
<div class="field"><label>ملف استيراد السيرفرات JSON</label><input id="privateFile" type="file" accept=".json,application/json"></div>
</div>
<div class="actions"><button class="btn" id="testWorker">فحص Worker</button><button class="btn primary" id="importPrivate">رفع السيرفرات إلى Worker</button></div>
<div class="hint">ملف السيرفرات لا يترفع إلى GitHub. يُرسل مباشرة إلى Worker/KV.</div>
</div>

<div class="card"><div class="title" style="font-size:15px">إعدادات التطبيق</div>
<div class="row" style="margin-top:10px">
<div class="field"><label>اسم التطبيق</label><input id="appName"></div>
<div class="field"><label>Private API Base</label><input id="privateApiBase"></div>
<div class="field"><label>Telegram</label><input id="telegram"></div>
<div class="field"><label>سياسة الخصوصية</label><input id="privacy"></div>
<div class="field"><label>المباريات</label><input id="matches"></div>
<div class="field"><label>مسلسلات وأفلام</label><input id="movies"></div>
<div class="field"><label>أخبار الرياضة</label><input id="sportsNews"></div>
</div></div>

<div class="card"><div class="title" style="font-size:15px">الأقسام والقنوات</div><div id="sections"></div></div>
</div>

<script>
let DATA=null,currentSha=null;const $=id=>document.getElementById(id);
const esc=s=>(s??"").toString().replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function msg(t,type=""){$("status").textContent=t;$("status").className="status "+type}
function uid(p){return p+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,6)}
function ghHeaders(){const t=$("ghToken").value.trim();return t?{"Authorization":"Bearer "+t,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}:{"Accept":"application/vnd.github+json"}}
function apiUrl(){return "https://api.github.com/repos/"+$("repo").value.trim()+"/contents/"+$("path").value.trim()}
function b64ToText(b){const bin=atob(b.replace(/\s/g,""));return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}
function textToB64(s){const bytes=new TextEncoder().encode(s);let bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
async function load(){
 msg("جاري التحميل...");
 try{const r=await fetch(apiUrl()+"?ref="+encodeURIComponent($("branch").value.trim()),{headers:ghHeaders(),cache:"no-store"});if(!r.ok)throw new Error("GitHub "+r.status);const j=await r.json();currentSha=j.sha;DATA=JSON.parse(b64ToText(j.content));bind();render();msg("تم تحميل البيانات","ok")}catch(e){msg("فشل التحميل: "+e.message,"err")}
}
function bind(){$("appName").value=DATA.appName||"";$("privateApiBase").value=DATA.privateApiBase||"";$("workerUrl").value=DATA.privateApiBase||"";$("telegram").value=DATA.menu?.telegram||"";$("privacy").value=DATA.menu?.privacy||"";$("matches").value=DATA.menu?.matches||"";$("movies").value=DATA.menu?.movies||"";$("sportsNews").value=DATA.menu?.sportsNews||""}
function collect(){DATA.appName=$("appName").value.trim();DATA.privateApiBase=$("privateApiBase").value.trim().replace(/\/$/,"");DATA.menu=DATA.menu||{};DATA.menu.home="index.html";DATA.menu.telegram=$("telegram").value.trim();DATA.menu.privacy=$("privacy").value.trim();DATA.menu.matches=$("matches").value.trim();DATA.menu.movies=$("movies").value.trim();DATA.menu.sportsNews=$("sportsNews").value.trim()}
function render(){const box=$("sections");box.innerHTML="";(DATA.sections||[]).forEach((s,si)=>{const d=document.createElement("div");d.className="section";d.innerHTML='<div class="head"><b>'+esc(s.name)+'</b><span class="badge">'+(s.channels||[]).length+' قناة</span><button class="btn danger" data-del>حذف</button></div><div class="row" style="margin-top:9px"><div class="field"><label>اسم القسم</label><input data-k="name" value="'+esc(s.name)+'"></div><div class="field"><label>رابط الصورة</label><input data-k="image" value="'+esc(s.image)+'"></div></div><div data-ch></div><div class="actions"><button class="btn" data-add>+ قناة</button></div>';d.querySelectorAll("[data-k]").forEach(i=>i.oninput=()=>s[i.dataset.k]=i.value);d.querySelector("[data-del]").onclick=()=>{if(confirm("حذف القسم؟")){DATA.sections.splice(si,1);render()}};d.querySelector("[data-add]").onclick=()=>{s.channels=s.channels||[];s.channels.push({id:uid("channel"),name:"قناة جديدة",image:"",order:s.channels.length,enabled:true,serverCount:0});render()};const chbox=d.querySelector("[data-ch]");(s.channels||[]).forEach((c,ci)=>{const x=document.createElement("div");x.className="channel";x.innerHTML='<div class="head"><b>'+esc(c.name)+'</b><span class="badge">'+(c.serverCount||0)+' سيرفر</span><button class="btn danger" data-cdel>حذف</button></div><div class="row" style="margin-top:8px"><div class="field"><label>اسم القناة</label><input data-ck="name" value="'+esc(c.name)+'"></div><div class="field"><label>رابط الصورة</label><input data-ck="image" value="'+esc(c.image)+'"></div></div>';x.querySelectorAll("[data-ck]").forEach(i=>i.oninput=()=>c[i.dataset.ck]=i.value);x.querySelector("[data-cdel]").onclick=()=>{if(confirm("حذف القناة؟")){s.channels.splice(ci,1);render()}};chbox.appendChild(x)});box.appendChild(d)})}
$("reload").onclick=load;$("addSection").onclick=()=>{if(!DATA)return;DATA.sections.push({id:uid("section"),name:"قسم جديد",image:"",order:DATA.sections.length,enabled:true,channels:[]});render()};
$("savePublic").onclick=async()=>{if(!DATA)return;collect();if(!$("ghToken").value.trim())return msg("أدخل GitHub Token","err");msg("جاري الحفظ...");try{const body={message:"Update BSR public catalog",content:textToB64(JSON.stringify(DATA,null,2)),sha:currentSha,branch:$("branch").value.trim()};const r=await fetch(apiUrl(),{method:"PUT",headers:{...ghHeaders(),"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw new Error("GitHub "+r.status);const j=await r.json();currentSha=j.content?.sha||currentSha;msg("تم حفظ البيانات العامة","ok")}catch(e){msg("فشل الحفظ: "+e.message,"err")}};
$("testWorker").onclick=async()=>{const u=$("workerUrl").value.trim().replace(/\/$/,"");if(!u)return msg("ضع رابط Worker","err");try{const r=await fetch(u+"/health",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);msg("Worker يعمل","ok")}catch(e){msg("Worker لا يستجيب: "+e.message,"err")}};
$("importPrivate").onclick=async()=>{const u=$("workerUrl").value.trim().replace(/\/$/,""),key=$("adminKey").value.trim(),f=$("privateFile").files[0];if(!u||!key||!f)return msg("ضع Worker URL وAdmin Key واختر ملف JSON","err");msg("جاري رفع السيرفرات...");try{const body=await f.text();JSON.parse(body);const r=await fetch(u+"/admin/import",{method:"POST",headers:{"Content-Type":"application/json","X-Admin-Key":key},body});if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();$("privateApiBase").value=u;msg("تم رفع "+(j.saved||0)+" قناة إلى Worker. احفظ البيانات العامة أيضاً.","ok")}catch(e){msg("فشل رفع السيرفرات: "+e.message,"err")}};
load();
</script>
</body></html>
