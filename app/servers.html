<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>السيرفرات</title>
<style>
:root{--bg:#07111d;--card:#0d1b29;--card2:#102131;--text:#fff;--muted:#8294a5;--border:#25394c;--accent:#18d4dc;--bar:rgba(7,17,29,.97)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:25px}
.header{height:65px;position:sticky;top:0;z-index:50;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:7px 11px;background:var(--bar);border-bottom:1px solid var(--border);backdrop-filter:blur(14px)}
.back-btn{grid-column:3;width:43px;height:43px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center}.back-btn svg{width:24px;height:24px}.page-title{grid-column:2;grid-row:1;text-align:center;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{max-width:720px;margin:auto;padding:14px 11px}.channel-head{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:15px;background:linear-gradient(145deg,var(--card2),var(--card));margin-bottom:12px}.channel-head img{width:58px;height:58px;object-fit:contain;border-radius:11px;background:#07111b;padding:5px;border:1px solid var(--border)}.channel-name{font-size:16px;font-weight:800}.channel-sub{font-size:12px;color:var(--muted);margin-top:5px}
.server{width:100%;min-height:58px;margin:8px 0;border:1px solid var(--border);border-radius:13px;background:linear-gradient(145deg,var(--card2),var(--card));color:var(--text);padding:10px 13px;display:flex;align-items:center;justify-content:space-between;text-align:right}.server:active{transform:scale(.985)}.server-name{font-size:14px;font-weight:700}.play{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(24,212,220,.1);color:var(--accent);font-size:16px}.msg{padding:35px 12px;text-align:center;color:var(--muted);line-height:1.8;border:1px dashed var(--border);border-radius:14px;background:rgba(255,255,255,.02)}
</style>
</head>
<body>
<header class="header"><div></div><div class="page-title" id="title">السيرفرات</div><button class="back-btn" id="backBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></button></header>
<main class="content"><div id="channelHead"></div><div id="servers"><div class="msg">جاري تحميل السيرفرات...</div></div></main>
<script>
let APP={};const q=id=>document.getElementById(id),params=new URLSearchParams(location.search),sectionId=params.get("section"),channelId=params.get("channel");
function buildIntent(channel,server){const p=APP.player||{},scheme=p.scheme||"bsrplayer",host=p.host||"play",pkg=p.package||"com.bsr.player.pro",fallback=encodeURIComponent(p.fallback||"");if(!server?.url)return"";let qs="url="+encodeURIComponent(server.url)+"&name="+encodeURIComponent(channel.name||"");if(channel.image)qs+="&image="+encodeURIComponent(channel.image);if(server.userAgent)qs+="&ua="+encodeURIComponent(server.userAgent);if(server.referer)qs+="&referer="+encodeURIComponent(server.referer);if(server.origin)qs+="&origin="+encodeURIComponent(server.origin);if(server.cookie)qs+="&cookie="+encodeURIComponent(server.cookie);if(server.drmKey)qs+="&drm="+encodeURIComponent(server.drmKey);if(server.authorization)qs+="&authorization="+encodeURIComponent(server.authorization);if(server.accept)qs+="&accept="+encodeURIComponent(server.accept);if(server.xRequestedWith)qs+="&xrw="+encodeURIComponent(server.xRequestedWith);if(server.drmLicenseUrl)qs+="&drmLicenseUrl="+encodeURIComponent(server.drmLicenseUrl);if(server.drmLicenseHeaders)qs+="&drmLicenseHeaders="+encodeURIComponent(server.drmLicenseHeaders);if(server.playerMode)qs+="&playerMode="+encodeURIComponent(server.playerMode);return "intent://"+host+"?"+qs+"#Intent;scheme="+scheme+";package="+pkg+(fallback?";S.browser_fallback_url="+fallback:"")+";end"}
async function load(){try{const v=await fetch("data/version.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>({version:"1"}));const ver=v.version||"1";const [cfg,cat]=await Promise.all([fetch("data/config.json?v="+ver).then(r=>r.json()),fetch("data/categories/"+encodeURIComponent(sectionId)+".json?v="+ver).then(r=>{if(!r.ok)throw new Error("category");return r.json()})]);APP=cfg||{};const c=(cat.channels||[]).find(x=>x.id===channelId);if(!c){q("servers").innerHTML='<div class="msg">القناة غير موجودة.</div>';return}q("title").textContent=c.name||"السيرفرات";const list=(c.servers||[]).slice().sort((a,b)=>(a.order??9999)-(b.order??9999));q("channelHead").innerHTML='<div class="channel-head">'+(c.image?'<img src="'+c.image+'" alt="">':'')+'<div><div class="channel-name">'+c.name+'</div><div class="channel-sub">'+list.length+' سيرفر</div></div></div>';q("servers").innerHTML="";if(!list.length){q("servers").innerHTML='<div class="msg">لا توجد سيرفرات لهذه القناة.</div>';return}list.forEach((sv,i)=>{const b=document.createElement("button");b.className="server";b.innerHTML='<span class="server-name">'+(sv.name||("Server "+(i+1)))+'</span><span class="play">▶</span>';b.onclick=()=>{const u=buildIntent(c,sv);if(u)location.href=u};q("servers").appendChild(b)})}catch(e){q("servers").innerHTML='<div class="msg">تعذر تحميل السيرفرات من GitHub.</div>'}}
q("backBtn").onclick=()=>location.href="channels.html?id="+encodeURIComponent(sectionId||"");load();
</script>
</body>
</html>
