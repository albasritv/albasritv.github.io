<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>المباريات</title>
<style>
:root{--bg:#07111d;--card:#0d1b29;--card2:#102131;--text:#fff;--muted:#8294a5;--border:#25394c;--accent:#18d4dc;--bar:rgba(7,17,29,.97)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:82px}
.header{height:65px;position:sticky;top:0;z-index:50;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:7px 11px;background:var(--bar);border-bottom:1px solid var(--border);backdrop-filter:blur(14px)}
.page-title{grid-column:2;grid-row:1;text-align:center;font-size:18px;font-weight:800}
.content{max-width:900px;margin:auto;padding:12px 10px 20px}
.matches{display:grid;gap:10px}
.match-card{border:1px solid var(--border);border-radius:14px;background:linear-gradient(145deg,var(--card2),var(--card));overflow:hidden;box-shadow:0 5px 18px rgba(0,0,0,.12)}
.match-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border-bottom:1px solid rgba(120,160,190,.15);font-size:11px;color:var(--muted)}
.status.live{color:var(--accent);font-weight:800}.status.done{color:#9fb0bf}
.teams{display:grid;grid-template-columns:1fr 82px 1fr;align-items:center;gap:8px;padding:12px 10px}
.team{text-align:center;min-width:0}.logo{width:54px;height:54px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center}
.logo img{max-width:100%;max-height:100%;object-fit:contain}.team-name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid{text-align:center}.time{font-size:13px;font-weight:800}.score{font-size:19px;font-weight:900;color:var(--accent);margin-top:4px}.tournament{text-align:center;color:var(--muted);font-size:11px;padding:0 8px 10px}
.watch{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;padding:0 10px 11px}
.watch-btn{border:1px solid var(--border);background:#081522;color:var(--text);border-radius:10px;padding:8px 12px;font-size:11px;font-weight:800;cursor:pointer}
.watch-btn:focus,.watch-btn:active{outline:2px solid rgba(24,212,220,.45);color:var(--accent)}
.no-stream{text-align:center;color:var(--muted);font-size:11px;padding:0 10px 11px}.empty{text-align:center;color:var(--muted);padding:50px 10px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:72px;z-index:80;display:grid;grid-template-columns:repeat(4,1fr);padding:5px 6px 7px;background:var(--bar);border-top:1px solid var(--border);backdrop-filter:blur(14px)}
.bottom-btn{border:0;background:transparent;color:var(--muted);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;cursor:pointer}
.bottom-btn.active,.bottom-btn:focus{color:var(--accent);background:rgba(24,212,220,.10);outline:2px solid rgba(24,212,220,.45);outline-offset:-2px}
.nav-svg{width:22px;height:22px;display:block;fill:currentColor;flex:none}
.bottom-btn:focus .nav-svg,.bottom-btn.active .nav-svg{transform:scale(1.08)}
@media(max-width:420px){.teams{grid-template-columns:1fr 68px 1fr}.logo{width:46px;height:46px}.team-name{font-size:12px}}
</style>
</head>
<body>
<header class="header"><div></div><div class="page-title">المباريات</div><div></div></header>
<main class="content"><div class="matches" id="matches"><div class="empty">جاري تحميل المباريات...</div></div></main>

<nav class="bottom-nav">
<button class="bottom-btn" data-menu="home">
<svg class="nav-svg" viewBox="0 -960 960 960"><path d="m380-340 280-180-280-180v360Zm-60 220v-80H160q-33 0-56.5-23.5T80-280v-480q0-33 23.5-56.5T160-840h640q33 0 56.5 23.5T880-760v480q0 33-23.5 56.5T800-200H640v80H320ZM160-280h640v-480H160v480Z"/></svg><span>القنوات</span>
</button>
<button class="bottom-btn active" data-menu="matches" id="navMatches">
<svg class="nav-svg" viewBox="0 -960 960 960"><path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm200-500 54-18 16-54q-32-48-77-82.5T574-786l-54 38v56l160 112Zm-400 0 160-112v-56l-54-38q-54 17-99 51.5T210-652l16 54 54 18Zm110 220h180l56-160-146-102-144 102 54 160Z"/></svg><span>المباريات</span>
</button>
<button class="bottom-btn" data-menu="movies">
<svg class="nav-svg" viewBox="0 -960 960 960"><path d="m160-800 80 160h120l-80-160h80l80 160h120l-80-160h80l80 160h120l-80-160h120q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800Zm0 240v320h640v-320H160Z"/></svg><span>مسلسلات وأفلام</span>
</button>
<button class="bottom-btn" data-menu="sportsNews">
<svg class="nav-svg" viewBox="0 -960 960 960"><path d="M160-120q-33 0-56.5-23.5T80-200v-640l67 67 66-67 67 67 67-67 66 67 67-67 67 67 66-67 67 67 67-67 66 67 67-67v640q0 33-23.5 56.5T800-120H160Zm0-80h280v-240H160v240Zm360 0h280v-80H520v80Zm0-160h280v-80H520v80ZM160-520h640v-120H160v120Z"/></svg><span>أخبار الرياضة</span>
</button>
</nav>

<script>
let APP={menu:{}};
const box=document.getElementById("matches");
function go(u){if(u)location.href=u}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function utf8Base64(value){const bytes=new TextEncoder().encode(value);let binary="";for(const b of bytes)binary+=String.fromCharCode(b);return btoa(binary)}
async function openChannel(channelId){
 const p=APP.player||{},scheme=p.scheme||"BSRPlayer",pkg=p.package||"com.bsr.player.pro";
 const fallback=encodeURIComponent(p.fallback||("https://play.google.com/store/apps/details?id="+pkg));
 try{
   const v=await fetch("data/version.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>({version:"1"}));
   const channel=await fetch("data/channels/"+encodeURIComponent(channelId)+".json?v="+(v.version||"1"),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error();return r.json()});
   const servers=(channel.servers||[]).filter(s=>s&&s.url);
   if(!servers.length)throw new Error();
   const payload=servers.map((s,i)=>({
     name:s.name||("Server "+(i+1)),url:s.url||"",ua:s.userAgent||s.ua||"",user_agent:s.userAgent||s.user_agent||"",
     referer:s.referer||"",origin:s.origin||"",cookie:s.cookie||"",drmKey:s.drmKey||"",drm_key:s.drmKey||s.drm_key||"",
     playerMode:s.playerMode||"EXO",player_mode:s.playerMode||s.player_mode||"EXO",authorization:s.authorization||"",
     accept:s.accept||"",xRequestedWith:s.xRequestedWith||"",authUrl:s.authUrl||"",subtitleUrl:s.subtitleUrl||"",
     drmLicenseUrl:s.drmLicenseUrl||"",drmLicenseHeaders:s.drmLicenseHeaders||""
   }));
   const data=encodeURIComponent(utf8Base64(JSON.stringify(payload)));
   location.href="intent://servers?data="+data+"#Intent;scheme="+scheme+";package="+pkg+";S.browser_fallback_url="+fallback+";end";
 }catch(e){alert("تعذر فتح بث المباراة حالياً.")}
}
function statusClass(s){s=String(s||"");if(/جارية|مباشر|live/i.test(s))return"live";if(/انتهت|finished|final/i.test(s))return"done";return""}
function render(list){
 box.innerHTML="";
 if(!list.length){box.innerHTML='<div class="empty">لا توجد مباريات حالياً</div>';return}
 list.forEach(m=>{
   const card=document.createElement("section");card.className="match-card";
   const channels=(m.channels||[]).filter(x=>x&&x.channelId);
   const buttons=channels.length?channels.map((x,i)=>'<button class="watch-btn" data-channel="'+esc(x.channelId)+'">'+esc(x.channelTitle||("سيرفر "+(i+1)))+'</button>').join(""):'<div class="no-stream">لم يتم ربط بث لهذه المباراة بعد</div>';
   card.innerHTML=
     '<div class="match-top"><span>'+esc(m.tournament||"")+'</span><span class="status '+statusClass(m.status)+'">'+esc(m.status||"")+'</span></div>'+
     '<div class="teams">'+
       '<div class="team"><div class="logo">'+(m.homeLogo?'<img src="'+esc(m.homeLogo)+'" alt="">':'')+'</div><div class="team-name">'+esc(m.homeName)+'</div></div>'+
       '<div class="mid"><div class="time">'+esc(m.baghdadTime||m.meccaTime||"")+'</div><div class="score">'+esc(m.score||"")+'</div></div>'+
       '<div class="team"><div class="logo">'+(m.awayLogo?'<img src="'+esc(m.awayLogo)+'" alt="">':'')+'</div><div class="team-name">'+esc(m.awayName)+'</div></div>'+
     '</div>'+
     '<div class="tournament">'+esc(m.sourceDate||"")+'</div>'+
     '<div class="watch">'+buttons+'</div>';
   card.querySelectorAll("[data-channel]").forEach(b=>b.onclick=()=>openChannel(b.dataset.channel));
   box.appendChild(card);
 })
}
async function load(){
 try{
   const v=await fetch("data/version.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>({version:"1"}));
   const ver=v.version||"1";
   const [cfg,matches]=await Promise.all([
     fetch("data/config.json?v="+ver,{cache:"no-store"}).then(r=>r.json()),
     fetch("data/matches.json?v="+ver,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error();return r.json()})
   ]);
   APP=cfg||{};render(Array.isArray(matches)?matches:[]);
 }catch(e){box.innerHTML='<div class="empty">تعذر تحميل المباريات.</div>'}
}
document.querySelectorAll("[data-menu]").forEach(b=>b.onclick=()=>go(APP.menu?.[b.dataset.menu]||""));
load();setTimeout(()=>document.getElementById("navMatches")?.focus({preventScroll:true}),120);
</script>
</body>
</html>
