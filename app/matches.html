<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>المباريات - البصري بلاير</title>
<style>
:root{--bg:#07111d;--card:#0d1b29;--card2:#102131;--text:#fff;--muted:#8294a5;--border:#25394c;--accent:#18d4dc;--bar:rgba(7,17,29,.97);--green:#35db73;--red:#ff5d63;--gray:#a4afb9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:82px}
.header{height:65px;position:sticky;top:0;z-index:50;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:7px 11px;background:var(--bar);border-bottom:1px solid var(--border);backdrop-filter:blur(14px)}
.back{width:43px;height:43px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.back svg{width:23px;height:23px}.page-title{text-align:center;font-size:18px;font-weight:900}.content{max-width:900px;margin:auto;padding:12px 10px 20px}
.matches{display:grid;gap:12px}
.match-card{position:relative;border:1px solid var(--border);border-radius:18px;background:linear-gradient(145deg,var(--card2),var(--card));overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.match-card:before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.65}
.match-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px 6px;color:var(--muted);font-size:11px}
.match-tournament{font-weight:900;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.match-date{flex:none;font-size:10px}
.match-body{display:grid;grid-template-columns:minmax(0,1fr) 106px minmax(0,1fr);align-items:center;gap:8px;padding:10px 12px 14px}
.team{text-align:center;min-width:0}.logo{width:60px;height:60px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;padding:5px;border-radius:16px;background:rgba(3,12,21,.30)}
.logo img{max-width:100%;max-height:100%;object-fit:contain}.team-name{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{text-align:center;min-width:0}.main-value{font-size:18px;font-weight:900;min-height:24px;display:flex;align-items:center;justify-content:center;line-height:1.2}
.main-value.score{font-size:22px;letter-spacing:.4px}.status{display:inline-flex;align-items:center;justify-content:center;min-width:84px;margin-top:8px;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:900;border:1px solid transparent}
.status.upcoming{color:var(--green);background:rgba(53,219,115,.10);border-color:rgba(53,219,115,.30)}
.status.live{color:var(--red);background:rgba(255,93,99,.11);border-color:rgba(255,93,99,.32);animation:pulse 1.5s infinite}
.status.finished{color:var(--gray);background:rgba(164,175,185,.10);border-color:rgba(164,175,185,.24)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,93,99,0)}50%{box-shadow:0 0 0 5px rgba(255,93,99,.08)}}
.watch{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;padding:0 12px 13px}
.watch-btn{border:1px solid var(--border);background:#081522;color:var(--text);border-radius:10px;padding:8px 12px;font-size:11px;font-weight:900;cursor:pointer}
.watch-btn:focus,.watch-btn:active{outline:2px solid rgba(24,212,220,.45);color:var(--accent)}
.no-stream{text-align:center;color:var(--muted);font-size:11px;padding:0 12px 13px}.empty{text-align:center;color:var(--muted);padding:50px 10px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:72px;z-index:80;display:grid;grid-template-columns:repeat(4,1fr);padding:5px 6px 7px;background:var(--bar);border-top:1px solid var(--border);backdrop-filter:blur(14px)}
.bottom-btn{border:0;background:transparent;color:var(--muted);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;cursor:pointer}
.bottom-btn.active,.bottom-btn:focus{color:var(--accent);background:rgba(24,212,220,.10);outline:2px solid rgba(24,212,220,.45);outline-offset:-2px}.nav-svg{width:22px;height:22px;display:block;fill:currentColor}
@media(max-width:420px){.match-body{grid-template-columns:minmax(0,1fr) 88px minmax(0,1fr);gap:5px;padding-inline:8px}.logo{width:50px;height:50px}.team-name{font-size:12px}.main-value{font-size:15px}.main-value.score{font-size:19px}.status{min-width:72px;padding:5px 7px;font-size:10px}}
</style>
</head>
<body>
<header class="header">
<button class="back" id="backBtn" aria-label="رجوع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></button>
<div class="page-title">المباريات</div><div></div>
</header>
<main class="content"><div class="matches" id="matches"><div class="empty">جاري تحميل المباريات...</div></div></main>
<nav class="bottom-nav">
<button class="bottom-btn" data-menu="home"><svg class="nav-svg" viewBox="0 -960 960 960"><path d="m380-340 280-180-280-180v360Zm-60 220v-80H160q-33 0-56.5-23.5T80-280v-480q0-33 23.5-56.5T160-840h640q33 0 56.5 23.5T880-760v480q0 33-23.5 56.5T800-200H640v80H320Z"/></svg><span>القنوات</span></button>
<button class="bottom-btn active" data-menu="matches" id="navMatches"><svg class="nav-svg" viewBox="0 -960 960 960"><path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm-90-280h180l56-160-146-102-144 102 54 160Z"/></svg><span>المباريات</span></button>
<button class="bottom-btn" data-menu="movies"><svg class="nav-svg" viewBox="0 -960 960 960"><path d="m160-800 80 160h120l-80-160h80l80 160h120l-80-160h80l80 160h120l-80-160h120q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800Zm0 240v320h640v-320H160Z"/></svg><span>مسلسلات وأفلام</span></button>
<button class="bottom-btn" data-menu="sportsNews"><svg class="nav-svg" viewBox="0 -960 960 960"><path d="M160-120q-33 0-56.5-23.5T80-200v-640l67 67 66-67 67 67 67-67 66 67 67-67 67 67 66-67 67 67 67-67 66 67 67-67v640q0 33-23.5 56.5T800-120H160Z"/></svg><span>أخبار الرياضة</span></button>
</nav>
<script>
const RAW="https://raw.githubusercontent.com/albasritv/albasritv.github.io/main/app/";let APP={menu:{}};const box=document.getElementById("matches");
function go(u){if(u)location.href=u}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function statusInfo(raw){const s=String(raw||"").trim();if(/جارية|مباشر|live|playing|in progress/i.test(s))return{key:"live",label:"جارية الآن"};if(/انتهت|finished|final|ended/i.test(s))return{key:"finished",label:"انتهت"};return{key:"upcoming",label:"لم تبدأ"}}
function utf8Base64(value){const bytes=new TextEncoder().encode(value);let binary="";for(const b of bytes)binary+=String.fromCharCode(b);return btoa(binary)}
async function openChannel(channelId){
 const p=APP.player||{},scheme=p.scheme||"BSRPlayer",pkg=p.package||"com.bsr.player.pro";const fallback=encodeURIComponent(p.fallback||("https://play.google.com/store/apps/details?id="+pkg));
 try{
  const channel=await fetch(RAW+"data/channels/"+encodeURIComponent(channelId)+".json?t="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error();return r.json()});
  const servers=(channel.servers||[]).filter(s=>s&&s.url);if(!servers.length)throw new Error();
  const payload=servers.map((s,i)=>({name:s.name||("Server "+(i+1)),url:s.url||"",ua:s.userAgent||s.ua||"",user_agent:s.userAgent||s.user_agent||"",referer:s.referer||"",origin:s.origin||"",cookie:s.cookie||"",drmKey:s.drmKey||"",drm_key:s.drmKey||s.drm_key||"",playerMode:s.playerMode||"EXO",player_mode:s.playerMode||s.player_mode||"EXO",authorization:s.authorization||"",accept:s.accept||"",xRequestedWith:s.xRequestedWith||"",authUrl:s.authUrl||"",subtitleUrl:s.subtitleUrl||"",drmLicenseUrl:s.drmLicenseUrl||"",drmLicenseHeaders:s.drmLicenseHeaders||""}));
  const data=encodeURIComponent(utf8Base64(JSON.stringify(payload)));location.href="intent://servers?data="+data+"#Intent;scheme="+scheme+";package="+pkg+";S.browser_fallback_url="+fallback+";end";
 }catch(e){alert("تعذر فتح بث المباراة حالياً.")}
}
function render(list){
 box.innerHTML="";if(!Array.isArray(list)||!list.length){box.innerHTML='<div class="empty">لا توجد مباريات حالياً</div>';return}
 list.forEach(m=>{
  const st=statusInfo(m.status);const showScore=(st.key==="live"||st.key==="finished")&&m.score;const main=showScore?m.score:(m.baghdadTime||m.meccaTime||"--:--");const channels=(m.channels||[]).filter(x=>x&&x.channelId);
  const card=document.createElement("article");card.className="match-card";
  card.innerHTML='<div class="match-meta"><span class="match-tournament">'+esc(m.tournament||"مباريات اليوم")+'</span><span class="match-date">'+esc(m.sourceDate||"")+'</span></div>'+
   '<div class="match-body">'+
    '<div class="team"><div class="logo">'+(m.homeLogo?'<img src="'+esc(m.homeLogo)+'" alt="">':'')+'</div><div class="team-name">'+esc(m.homeName||"")+'</div></div>'+
    '<div class="center"><div class="main-value '+(showScore?'score':'')+'">'+esc(main)+'</div><div class="status '+st.key+'">'+st.label+'</div></div>'+
    '<div class="team"><div class="logo">'+(m.awayLogo?'<img src="'+esc(m.awayLogo)+'" alt="">':'')+'</div><div class="team-name">'+esc(m.awayName||"")+'</div></div>'+
   '</div>'+
   (channels.length?'<div class="watch">'+channels.map((x,i)=>'<button class="watch-btn" data-channel="'+esc(x.channelId)+'">'+esc(x.channelTitle||("مشاهدة "+(i+1)))+'</button>').join("")+'</div>':'<div class="no-stream">لم يتم ربط بث لهذه المباراة بعد</div>');
  card.querySelectorAll("[data-channel]").forEach(b=>b.onclick=()=>openChannel(b.dataset.channel));box.appendChild(card);
 })
}
async function load(){
 try{
  const [cfg,liveMatches,fallbackMatches]=await Promise.all([
   fetch(RAW+"data/config.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.json()),
   fetch(RAW+"data/matches-live.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null),
   fetch(RAW+"data/matches.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():[]).catch(()=>[])
  ]);
  APP=cfg||{};render(Array.isArray(liveMatches)?liveMatches:fallbackMatches);
 }catch(e){box.innerHTML='<div class="empty">تعذر تحميل المباريات.</div>'}
}
document.getElementById("backBtn").onclick=()=>go("index.html?v=20260919");
document.querySelectorAll("[data-menu]").forEach(b=>b.onclick=()=>{const m=b.dataset.menu;if(m==="home")return go("index.html?v=20260919");if(m==="matches")return;go(APP.menu?.[m]||"")});
load();setTimeout(()=>document.getElementById("navMatches")?.focus({preventScroll:true}),120);
</script>
</body></html>
