<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>البصري بلاير</title>
<style>
:root{--bg:#07111d;--card:#0d1b29;--card2:#102131;--text:#fff;--muted:#8294a5;--border:#25394c;--accent:#18d4dc;--bar:rgba(7,17,29,.97)}
body.light{--bg:#f4f6f8;--card:#fff;--card2:#f5f7f9;--text:#17212b;--muted:#71808d;--border:#d9e0e6;--accent:#078d9b;--bar:rgba(255,255,255,.97)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:82px;transition:.2s}.header{height:65px;position:sticky;top:0;z-index:50;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:7px 11px;background:var(--bar);border-bottom:1px solid var(--border);backdrop-filter:blur(14px)}.menu-btn{grid-column:1;grid-row:1}.app-name{grid-column:2;grid-row:1;text-align:center;font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.app-name span{color:var(--accent)}.search-btn{grid-column:3;grid-row:1}.header-btn{width:43px;height:43px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}.header-btn svg{width:23px;height:23px}.search-area{max-height:0;overflow:hidden;background:var(--bg);transition:.25s}.search-area.show{max-height:75px;padding:9px 11px}.search-input{width:100%;height:46px;border-radius:12px;border:1px solid var(--border);outline:none;background:var(--card);color:var(--text);padding:0 15px;font-size:15px}.search-input:focus{border-color:var(--accent)}.content{max-width:900px;margin:auto;padding:13px 10px 20px}.sections-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.section-card{min-width:0;height:78px;display:flex;align-items:center;padding:8px;border-radius:11px;border:1px solid var(--border);background:linear-gradient(145deg,var(--card2),var(--card));cursor:pointer;transition:.15s}.section-card:active{transform:scale(.97)}.image-box{width:48px;height:48px;flex:none;padding:3px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#07111b;border:1px solid #466078;overflow:hidden}.image-box img{width:100%;height:100%;object-fit:contain;border-radius:6px}.image-fallback{font-size:11px;font-weight:800;color:var(--accent)}.section-name{flex:1;min-width:0;margin-right:10px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{grid-column:1/-1;padding:45px 10px;text-align:center;color:var(--muted);font-size:14px}.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:72px;z-index:80;display:grid;grid-template-columns:repeat(4,1fr);padding:5px 6px 7px;background:var(--bar);border-top:1px solid var(--border);backdrop-filter:blur(14px)}.bottom-btn{border:0;background:transparent;color:var(--muted);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;cursor:pointer}.bottom-btn svg{width:22px;height:22px}.bottom-btn.active{color:var(--accent);background:rgba(24,212,220,.08)}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:99;opacity:0;visibility:hidden;transition:.22s}.overlay.show{opacity:1;visibility:visible}.side-menu{position:fixed;top:0;left:-310px;bottom:0;width:min(295px,87%);z-index:100;background:var(--bg);border-right:1px solid var(--border);padding:0 12px 20px;transition:.28s;overflow-y:auto}.side-menu.show{left:0}.side-header{text-align:center;padding:25px 5px 20px;border-bottom:1px solid var(--border);margin-bottom:10px}.logo-circle{width:58px;height:58px;margin:0 auto 10px;border-radius:17px;display:flex;justify-content:center;align-items:center;background:linear-gradient(145deg,#10d6dc,#056a83);color:#fff}.logo-circle svg{width:30px;height:30px}.side-title{font-size:18px;font-weight:800}.side-title span{color:var(--accent)}.menu-item{width:100%;min-height:55px;display:flex;align-items:center;gap:11px;padding:7px 9px;margin:4px 0;border:0;border-radius:12px;background:transparent;color:var(--text);font-size:14px;text-align:right;cursor:pointer}.menu-item:active{background:var(--card)}.menu-icon{width:38px;height:38px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--accent);border:1px solid var(--border)}.menu-icon svg{width:20px;height:20px}.menu-name{flex:1}.switch{position:relative;width:44px;height:25px;flex:none}.switch input{display:none}.slider{position:absolute;inset:0;border-radius:30px;background:#364757;transition:.2s}.slider:before{content:"";width:19px;height:19px;position:absolute;top:3px;right:3px;border-radius:50%;background:#fff;transition:.2s}.switch input:checked+.slider{background:var(--accent)}.switch input:checked+.slider:before{transform:translateX(-19px)}@media(max-width:370px){.section-card{height:72px;padding:7px}.image-box{width:44px;height:44px}.section-name{font-size:12px;margin-right:8px}}
</style>
</head>
<body>
<header class="header">
<button class="header-btn menu-btn" id="menuBtn" aria-label="القائمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
<div class="app-name" id="appName"><span>البصري</span> بلاير</div>
<button class="header-btn search-btn" id="searchBtn" aria-label="بحث"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
</header>
<div class="search-area" id="searchArea"><input id="searchInput" class="search-input" type="search" placeholder="ابحث عن قسم أو قناة..." autocomplete="off"></div>
<main class="content"><div class="sections-grid" id="sectionsGrid"><div class="empty">جاري تحميل الأقسام...</div></div></main>
<nav class="bottom-nav">
<button class="bottom-btn active" data-menu="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11 12 3l9 8"/><path d="M5 10v11h14V10"/><path d="M9 21v-6h6v6"/></svg><span>الرئيسية</span></button>
<button class="bottom-btn" data-menu="matches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m8.5 8 3.5-2 3.5 2 1 4-2.8 3h-3.5l-2.7-3z"/></svg><span>المباريات</span></button>
<button class="bottom-btn" data-menu="movies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="m10 9 6 3-6 3z"/><path d="M3 9h18"/></svg><span>مسلسلات وأفلام</span></button>
<button class="bottom-btn" data-menu="sportsNews"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>أخبار الرياضة</span></button>
</nav>
<div class="overlay" id="overlay"></div>
<aside class="side-menu" id="sideMenu">
<div class="side-header"><div class="logo-circle"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div><div class="side-title"><span>البصري</span> بلاير</div></div>
<button class="menu-item" data-menu="home"><span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11 12 3l9 8"/><path d="M5 10v11h14V10"/></svg></span><span class="menu-name">الرئيسية</span></button>
<button class="menu-item" data-menu="telegram"><span class="menu-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.7 3.3 18.5 19c-.2 1.1-.9 1.4-1.8.9l-4.8-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.9 8.9-8c.4-.3-.1-.5-.6-.2L6.2 12.9l-4.7-1.5c-1-.3-1-1 .2-1.5L20.1 2.8c.9-.3 1.7.2 1.6.5z"/></svg></span><span class="menu-name">قناة التليجرام</span></button>
<button class="menu-item" data-menu="privacy"><span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></span><span class="menu-name">سياسة الخصوصية</span></button>
<label class="menu-item"><span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></span><span class="menu-name">الوضع الليلي</span><span class="switch"><input type="checkbox" id="themeSwitch" checked><span class="slider"></span></span></label>
</aside>
<script>
let APP={menu:{},sections:[]};
const q=id=>document.getElementById(id), grid=q("sectionsGrid"), searchInput=q("searchInput");
function go(url){if(url) location.href=url}
function fallback(name){return '<span class="image-fallback">'+(name||"TV").slice(0,3)+'</span>'}
function cardImage(s){return s.image?'<img src="'+s.image+'" alt="" onerror="this.outerHTML=\''+fallback(s.name).replace(/'/g,"&#39;")+'\'">':fallback(s.name)}
function render(list){grid.innerHTML="";if(!list.length){grid.innerHTML='<div class="empty">لا توجد نتائج</div>';return}list.forEach(s=>{const el=document.createElement("div");el.className="section-card";el.innerHTML='<div class="image-box">'+cardImage(s)+'</div><div class="section-name">'+s.name+'</div>';el.addEventListener("click",()=>go("channels.html?id="+encodeURIComponent(s.id)));grid.appendChild(el)})}
async function load(){try{const r=await fetch("data/data.json?v="+Date.now(),{cache:"no-store"});APP=await r.json();q("appName").textContent=APP.appName||"البصري بلاير";render((APP.sections||[]).filter(x=>x.enabled!==false))}catch(e){grid.innerHTML='<div class="empty">تعذر تحميل البيانات</div>'}}
q("searchBtn").onclick=()=>{q("searchArea").classList.toggle("show");if(q("searchArea").classList.contains("show"))setTimeout(()=>searchInput.focus(),120)};
searchInput.addEventListener("input",()=>{const t=searchInput.value.trim().toLowerCase(), all=(APP.sections||[]).filter(x=>x.enabled!==false);if(!t)return render(all);render(all.filter(s=>(s.name+" "+(s.channels||[]).map(c=>c.name).join(" ")).toLowerCase().includes(t)))});
q("menuBtn").onclick=()=>{q("sideMenu").classList.add("show");q("overlay").classList.add("show")};q("overlay").onclick=()=>{q("sideMenu").classList.remove("show");q("overlay").classList.remove("show")};
document.querySelectorAll("[data-menu]").forEach(b=>b.addEventListener("click",()=>go(APP.menu?.[b.dataset.menu]||"")));
const theme=q("themeSwitch");const saved=localStorage.getItem("bsr-theme");if(saved==="light"){document.body.classList.add("light");theme.checked=false}theme.onchange=()=>{document.body.classList.toggle("light",!theme.checked);localStorage.setItem("bsr-theme",theme.checked?"dark":"light")};
load();
</script>
</body>
</html>
