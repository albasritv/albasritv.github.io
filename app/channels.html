<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>القنوات</title>
<style>
:root{--bg:#07111d;--card:#0d1b29;--card2:#102131;--text:#fff;--muted:#8294a5;--border:#25394c;--accent:#18d4dc;--bar:rgba(7,17,29,.97)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:82px}
.header{height:65px;position:sticky;top:0;z-index:50;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:7px 11px;background:var(--bar);border-bottom:1px solid var(--border);backdrop-filter:blur(14px)}
.back-btn{grid-column:3;width:43px;height:43px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center}.back-btn svg{width:24px;height:24px}.page-title{grid-column:2;grid-row:1;text-align:center;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{max-width:900px;margin:auto;padding:12px 10px 20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.card{height:80px;display:flex;align-items:center;padding:8px 9px;border:1px solid var(--border);border-radius:12px;background:linear-gradient(145deg,var(--card2),var(--card));box-shadow:0 5px 18px rgba(0,0,0,.12);cursor:pointer}.card:active{transform:scale(.97)}
.image-box{width:52px;height:52px;flex:0 0 52px;padding:5px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(4,13,22,.75);border:1px solid rgba(120,160,190,.35);overflow:hidden}.image-box img{width:100%;height:100%;object-fit:contain;border-radius:7px}.fallback{font-size:10px;font-weight:800;color:var(--accent)}
.name{flex:1;min-width:0;margin-right:10px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.play{font-size:18px;color:var(--accent);margin-right:5px}.empty{grid-column:1/-1;padding:45px 10px;text-align:center;color:var(--muted);font-size:14px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:72px;z-index:80;display:grid;grid-template-columns:repeat(4,1fr);padding:5px 6px 7px;background:var(--bar);border-top:1px solid var(--border);backdrop-filter:blur(14px)}.bottom-btn{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px}.bottom-btn.active,.bottom-btn:focus{color:var(--accent);background:rgba(24,212,220,.10);outline:2px solid rgba(24,212,220,.45);outline-offset:-2px}.bottom-btn svg{width:22px;height:22px}.nav-svg{width:22px;height:22px;display:block;fill:currentColor;flex:none}.bottom-btn:focus .nav-svg,.bottom-btn.active .nav-svg{transform:scale(1.08)}
</style>
</head>
<body>
<header class="header"><div></div><div class="page-title" id="title">القنوات</div><button class="back-btn" id="backBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></button></header>
<main class="content"><div class="grid" id="grid"><div class="empty">جاري تحميل القنوات...</div></div></main>
<nav class="bottom-nav">
<button class="bottom-btn active" data-menu="home" id="navHome">
<svg class="nav-svg" viewBox="0 -960 960 960" aria-hidden="true"><path d="m380-340 280-180-280-180v360Zm-60 220v-80H160q-33 0-56.5-23.5T80-280v-480q0-33 23.5-56.5T160-840h640q33 0 56.5 23.5T880-760v480q0 33-23.5 56.5T800-200H640v80H320ZM160-280h640v-480H160v480Zm0 0v-480 480Z"/></svg>
<span>القنوات</span>
</button>
<button class="bottom-btn" data-menu="matches">
<svg class="nav-svg" viewBox="0 -960 960 960" aria-hidden="true"><path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm200-500 54-18 16-54q-32-48-77-82.5T574-786l-54 38v56l160 112Zm-400 0 160-112v-56l-54-38q-54 17-99 51.5T210-652l16 54 54 18Zm-42 308 46-4 30-54-58-174-56-20-40 30q0 65 18 118.5T238-272Zm293 108q25-4 49-12l28-60-26-44H378l-26 44 28 60q24 8 49 12t51 4q26 0 51-4ZM390-360h180l56-160-146-102-144 102 54 160Zm332 88q42-50 60-103.5T800-494l-40-28-56 18-58 174 30 54 46 4Z"/></svg>
<span>المباريات</span>
</button>
<button class="bottom-btn" data-menu="movies">
<svg class="nav-svg" viewBox="0 -960 960 960" aria-hidden="true"><path d="m160-800 80 160h120l-80-160h80l80 160h120l-80-160h80l80 160h120l-80-160h120q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800Zm0 240v320h640v-320H160Zm0 0v320-320Z"/></svg>
<span>مسلسلات وأفلام</span>
</button>
<button class="bottom-btn" data-menu="sportsNews">
<svg class="nav-svg" viewBox="0 -960 960 960" aria-hidden="true"><path d="M160-120q-33 0-56.5-23.5T80-200v-640l67 67 66-67 67 67 67-67 66 67 67-67 67 67 66-67 67 67 67-67 66 67 67-67v640q0 33-23.5 56.5T800-120H160Zm0-80h280v-240H160v240Zm360 0h280v-80H520v80Zm0-160h280v-80H520v80ZM160-520h640v-120H160v120Z"/></svg>
<span>أخبار الرياضة</span>
</button>
</nav>
<script>
let APP={menu:{}};const q=id=>document.getElementById(id),grid=q("grid"),sectionId=new URLSearchParams(location.search).get("id");
function go(u){if(u)location.href=u}
function img(c){return c.image?'<img loading="lazy" src="'+c.image+'" alt="" onerror="this.outerHTML=\'<span class=&quot;fallback&quot;>TV</span>\'">':'<span class="fallback">TV</span>'}
function utf8Base64(value){
 const bytes=new TextEncoder().encode(value);
 let binary="";
 for(const b of bytes)binary+=String.fromCharCode(b);
 return btoa(binary);
}
async function openInPlayer(c){
 const p=APP.player||{},scheme=p.scheme||"BSRPlayer",pkg=p.package||"com.bsr.player.pro";
 const fallback=encodeURIComponent(p.fallback||("https://play.google.com/store/apps/details?id="+pkg));
 try{
   const v=await fetch("data/version.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>({version:"1"}));
   const ver=v.version||"1";
   const channel=await fetch("data/channels/"+encodeURIComponent(c.id)+".json?v="+ver,{cache:"no-store"}).then(r=>{
     if(!r.ok)throw new Error("channel");
     return r.json();
   });
   const servers=(channel.servers||[]).filter(s=>s&&s.url);
   if(!servers.length)throw new Error("no_servers");
   const payload=servers.map((s,i)=>({
     name:s.name||("Server "+(i+1)),
     url:s.url||"",
     ua:s.userAgent||s.ua||"",
     user_agent:s.userAgent||s.user_agent||"",
     referer:s.referer||"",
     origin:s.origin||"",
     cookie:s.cookie||"",
     drmKey:s.drmKey||"",
     drm_key:s.drmKey||s.drm_key||"",
     playerMode:s.playerMode||"EXO",
     player_mode:s.playerMode||s.player_mode||"EXO",
     authorization:s.authorization||"",
     accept:s.accept||"",
     xRequestedWith:s.xRequestedWith||"",
     authUrl:s.authUrl||"",
     subtitleUrl:s.subtitleUrl||"",
     drmLicenseUrl:s.drmLicenseUrl||"",
     drmLicenseHeaders:s.drmLicenseHeaders||""
   }));
   const data=encodeURIComponent(utf8Base64(JSON.stringify(payload)));
   const link="intent://servers?data="+data+"#Intent;scheme="+scheme+";package="+pkg+";S.browser_fallback_url="+fallback+";end";
   location.href=link;
 }catch(e){
   alert("تعذر تحميل سيرفرات القناة. حاول مرة ثانية.");
 }
}
function render(s){
 q("title").textContent=s.name||"القنوات";
 const list=(s.channels||[]).filter(x=>x.enabled!==false).slice().sort((a,b)=>(a.order??9999)-(b.order??9999));
 grid.innerHTML="";
 if(!list.length){grid.innerHTML='<div class="empty">لا توجد قنوات حالياً</div>';return}
 list.forEach(c=>{
   const el=document.createElement("div");el.className="card";
   el.innerHTML='<div class="image-box">'+img(c)+'</div><div class="name">'+c.name+'</div><div class="play">▶</div>';
   el.onclick=()=>openInPlayer(c);
   grid.appendChild(el);
 });
}
async function load(){
 try{
   const v=await fetch("data/version.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>({version:"1"}));
   const ver=v.version||"1";
   const [cfg,s]=await Promise.all([
     fetch("data/config.json?v="+ver).then(r=>r.json()),
     fetch("data/categories/"+encodeURIComponent(sectionId)+".json?v="+ver).then(r=>{if(!r.ok)throw new Error("category");return r.json()})
   ]);
   APP=cfg||{};render(s);
 }catch(e){grid.innerHTML='<div class="empty">تعذر تحميل القنوات.</div>'}
}
q("backBtn").onclick=()=>go("index.html");
document.querySelectorAll("[data-menu]").forEach(b=>b.onclick=()=>go(APP.menu?.[b.dataset.menu]||""));
load();setTimeout(()=>{const h=document.getElementById("navHome");if(h){h.tabIndex=0;h.focus({preventScroll:true})}},120);
</script>
</body></html>
