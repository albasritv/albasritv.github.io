<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>القنوات</title>
<style>
:root{--bg:#07111d;--card:#0d1b29;--card2:#102131;--text:#fff;--muted:#8294a5;--border:#25394c;--accent:#18d4dc;--bar:rgba(7,17,29,.97)}
body.light{--bg:#f4f6f8;--card:#fff;--card2:#f5f7f9;--text:#17212b;--muted:#71808d;--border:#d9e0e6;--accent:#078d9b;--bar:rgba(255,255,255,.97)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:82px}.header{height:65px;position:sticky;top:0;z-index:50;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:7px 11px;background:var(--bar);border-bottom:1px solid var(--border);backdrop-filter:blur(14px)}.back-btn{grid-column:3;grid-row:1;width:43px;height:43px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}.back-btn svg{width:24px;height:24px}.page-title{grid-column:2;grid-row:1;text-align:center;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.content{max-width:900px;margin:auto;padding:13px 10px 20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{min-width:0;height:78px;display:flex;align-items:center;padding:8px;border-radius:11px;border:1px solid var(--border);background:linear-gradient(145deg,var(--card2),var(--card));cursor:pointer;transition:.15s}.card:active{transform:scale(.97)}.image-box{width:48px;height:48px;flex:none;padding:3px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#07111b;border:1px solid #466078;overflow:hidden}.image-box img{width:100%;height:100%;object-fit:contain;border-radius:6px}.fallback{font-size:11px;font-weight:800;color:var(--accent)}.name{flex:1;min-width:0;margin-right:10px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{grid-column:1/-1;padding:45px 10px;text-align:center;color:var(--muted);font-size:14px}.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:72px;z-index:80;display:grid;grid-template-columns:repeat(4,1fr);padding:5px 6px 7px;background:var(--bar);border-top:1px solid var(--border);backdrop-filter:blur(14px)}.bottom-btn{border:0;background:transparent;color:var(--muted);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;cursor:pointer}.bottom-btn svg{width:22px;height:22px}
</style>
</head>
<body>
<header class="header"><div></div><div class="page-title" id="title">القنوات</div><button class="back-btn" id="backBtn" aria-label="رجوع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></button></header>
<main class="content"><div class="grid" id="grid"><div class="empty">جاري تحميل القنوات...</div></div></main>
<nav class="bottom-nav">
<button class="bottom-btn" data-menu="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11 12 3l9 8"/><path d="M5 10v11h14V10"/></svg><span>الرئيسية</span></button>
<button class="bottom-btn" data-menu="matches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m8.5 8 3.5-2 3.5 2 1 4-2.8 3h-3.5l-2.7-3z"/></svg><span>المباريات</span></button>
<button class="bottom-btn" data-menu="movies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="m10 9 6 3-6 3z"/></svg><span>مسلسلات وأفلام</span></button>
<button class="bottom-btn" data-menu="sportsNews"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>أخبار الرياضة</span></button>
</nav>
<script>
let APP={menu:{},sections:[]};const q=id=>document.getElementById(id),grid=q("grid");const sectionId=new URLSearchParams(location.search).get("id");
function go(u){if(u)location.href=u}function img(c){return c.image?'<img src="'+c.image+'" alt="" onerror="this.outerHTML=\'<span class=&quot;fallback&quot;>TV</span>\'">':'<span class="fallback">TV</span>'}
function buildIntent(c){if(c.redirect)return c.redirect;if(!c.stream)return"";const p=APP.player||{},scheme=p.scheme||"bsrplayer",host=p.host||"play",pkg=p.package||"com.bsr.player.pro",fallback=encodeURIComponent(p.fallback||"");let qs="url="+encodeURIComponent(c.stream);if(c.name)qs+="&name="+encodeURIComponent(c.name);if(c.image)qs+="&image="+encodeURIComponent(c.image);if(c.userAgent)qs+="&ua="+encodeURIComponent(c.userAgent);if(c.referer)qs+="&referer="+encodeURIComponent(c.referer);if(c.origin)qs+="&origin="+encodeURIComponent(c.origin);if(c.cookie)qs+="&cookie="+encodeURIComponent(c.cookie);if(c.drm)qs+="&drm="+encodeURIComponent(c.drm);return "intent://"+host+"?"+qs+"#Intent;scheme="+scheme+";package="+pkg+(fallback?";S.browser_fallback_url="+fallback:"")+";end"}
function render(s){q("title").textContent=s.name||"القنوات";const list=(s.channels||[]).filter(x=>x.enabled!==false);grid.innerHTML="";if(!list.length){grid.innerHTML='<div class="empty">لا توجد قنوات حالياً</div>';return}list.forEach(c=>{const el=document.createElement("div");el.className="card";el.innerHTML='<div class="image-box">'+img(c)+'</div><div class="name">'+c.name+'</div>';el.onclick=()=>{const u=buildIntent(c);if(u)location.href=u};grid.appendChild(el)})}
async function load(){try{const r=await fetch("data/data.json?v="+Date.now(),{cache:"no-store"});APP=await r.json();const s=(APP.sections||[]).find(x=>x.id===sectionId&&x.enabled!==false);if(!s){grid.innerHTML='<div class="empty">القسم غير موجود</div>';return}render(s)}catch(e){grid.innerHTML='<div class="empty">تعذر تحميل البيانات</div>'}}
q("backBtn").onclick=()=>{if(history.length>1)history.back();else go("index.html")};document.querySelectorAll("[data-menu]").forEach(b=>b.onclick=()=>go(APP.menu?.[b.dataset.menu]||""));if(localStorage.getItem("bsr-theme")==="light")document.body.classList.add("light");load();
</script>
</body>
</html>
