
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="color-scheme" content="dark">
  <title>افلام ومسلسلات البصري تيفي </title>
  <meta name="description" content="مسلسلات وأفلام البصري TV - تصفح المسلسلات والأفلام العربية والأجنبية والتركية والآسيوية والأنمي، وابحث عن العمل وشاهد الحلقات من واجهة مناسبة للتطبيقات.">
  <meta name="keywords" content="البصري TV, مسلسلات وأفلام البصري TV, البصري تي في, مسلسلات, أفلام, حلقات, مسلسلات عربية, مسلسلات أجنبية, مسلسلات تركية, مسلسلات آسيوية, مسلسلات أنمي, مسلسلات رمضان, أفلام عربية, أفلام أجنبية, أفلام تركية, أفلام هندية, أفلام آسيوية, أفلام أنمي, مشاهدة مسلسلات, مشاهدة أفلام, تحميل أفلام, تحميل مسلسلات, Series, Movies, TV Series, Arabic Series, Turkish Series, Asian Series, Anime Series, Arabic Movies, Foreign Movies, Indian Movies, Asian Movies, Anime Movies, Watch Series, Watch Movies, Download Movies, Download Series, Streaming Movies, Streaming Series">
  <meta property="og:title" content="مسلسلات وأفلام البصري TV">
  <meta property="og:description" content="مسلسلات وأفلام البصري TV - بحث، أقسام، حلقات، مشاهدة وتحميل.">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

  <style>
    :root{
      --bg:#080d18;
      --surface:#111827;
      --surface-2:#172033;
      --surface-3:#1c2940;
      --primary:#17d9f4;
      --primary-2:#3b82f6;
      --text:#f8fafc;
      --muted:#94a3b8;
      --line:rgba(255,255,255,.075);
      --shadow:0 14px 35px rgba(0,0,0,.28);
      --r-xl:24px;
      --r-lg:18px;
      --r-md:14px;
      --plyr-color-main:#17d9f4;
      --plyr-video-background:#000;
    }

    *{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif;-webkit-tap-highlight-color:transparent}
    html,body{min-height:100%;background:var(--bg);color:var(--text);overflow-x:hidden}
    body{padding-bottom:max(22px,env(safe-area-inset-bottom))}
    button,input,a{font:inherit}
    button,a{touch-action:manipulation}
    a{text-decoration:none;color:inherit}

    .app-shell{width:min(1180px,100%);margin:0 auto;padding:18px 16px 34px}

    /* لا يوجد أي شريط علوي: البداية مباشرة بالبحث والتبويبات */
    .search-area{position:sticky;top:0;z-index:60;padding:8px 0 12px;background:linear-gradient(to bottom,var(--bg) 70%,rgba(8,13,24,0));}
    .search-box{height:54px;background:rgba(17,24,39,.96);border:1px solid var(--line);border-radius:18px;display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 8px 24px rgba(0,0,0,.18);backdrop-filter:blur(14px)}
    .search-box:focus-within{border-color:rgba(23,217,244,.65);box-shadow:0 0 0 3px rgba(23,217,244,.09)}
    .search-box i{color:var(--primary);font-size:18px}
    .search-box input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-size:15px}
    .search-box input::placeholder{color:#718096}
    .search-go{width:40px;height:40px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#06111b;display:grid;place-items:center;cursor:pointer;font-weight:900}

    .type-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 20px;background:var(--surface);padding:6px;border:1px solid var(--line);border-radius:18px}
    .type-tab{height:47px;border:0;border-radius:13px;background:transparent;color:var(--muted);font-weight:900;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:.2s ease}
    .type-tab.active{background:linear-gradient(135deg,rgba(23,217,244,.18),rgba(59,130,246,.18));color:#fff;box-shadow:inset 0 0 0 1px rgba(23,217,244,.35)}
    .type-tab.active i{color:var(--primary)}

    .view{display:none;animation:fadeUp .28s ease both}
    .view.active{display:block}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

    .hero{display:none}

    .section-title{display:flex;align-items:center;justify-content:space-between;margin:8px 0 13px}
    .section-title h2{font-size:18px;font-weight:900;display:flex;align-items:center;gap:9px}
    .section-title h2:before{content:"";width:4px;height:22px;border-radius:10px;background:linear-gradient(var(--primary),var(--primary-2))}
    .section-count{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:5px 9px;border-radius:999px}

    .category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:4px}
    .category-card{min-height:112px;background:radial-gradient(circle at 50% 0%,rgba(23,217,244,.12),transparent 52%),linear-gradient(160deg,#172033,#0f1726);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:15px 8px 13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;box-shadow:0 12px 28px rgba(0,0,0,.22);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
    .category-card:active{transform:scale(.95);border-color:rgba(23,217,244,.55);box-shadow:0 5px 15px rgba(0,0,0,.28)}
    .cat-icon{width:54px;height:54px;flex:0 0 54px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(23,217,244,.15),rgba(59,130,246,.08));color:#dffbff;font-size:24px;border:1px solid rgba(23,217,244,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 18px rgba(0,0,0,.2)}
    .cat-copy{text-align:center;min-width:0}.cat-copy strong{display:block;font-size:13px;font-weight:900;white-space:nowrap}.cat-copy small{display:none}

    .content-head{position:sticky;top:0;z-index:70;display:flex;align-items:center;gap:10px;margin:0 -16px 16px;padding:10px 16px;background:rgba(8,13,24,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .round-back{width:43px;height:43px;flex:0 0 43px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:#fff;display:grid;place-items:center;cursor:pointer}
    .content-head h2{font-size:18px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    .media-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
    .media-item{position:relative;overflow:hidden;border-radius:15px;background:var(--surface);border:1px solid var(--line);box-shadow:0 9px 20px rgba(0,0,0,.22);cursor:pointer;min-width:0}
    .media-item:active{transform:scale(.98)}
    .poster-wrap{position:relative;aspect-ratio:2/3;background:#111827;overflow:hidden}
    .media-item img{width:100%;height:100%;display:block;object-fit:cover;background:#111827}
    .media-badge{position:absolute;top:7px;right:7px;padding:4px 7px;border-radius:8px;background:rgba(2,6,23,.78);backdrop-filter:blur(8px);font-size:10px;font-weight:900;color:var(--primary);border:1px solid rgba(255,255,255,.08)}
    .media-title{padding:9px 8px 10px;font-size:12px;font-weight:800;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}

    .load-more{width:100%;height:50px;margin-top:18px;border:1px solid rgba(23,217,244,.25);border-radius:16px;background:rgba(23,217,244,.08);color:var(--primary);font-weight:900;cursor:pointer}

    .details-title{font-size:20px;font-weight:900;line-height:1.6;margin:3px 0 15px;text-align:center}
    .player-card{background:#000;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
    .player-card iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
    .plyr{border-radius:18px}

    .player-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:11px 0 18px}
    .action{min-height:46px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:800;font-size:13px;cursor:pointer}
    .action.download{background:linear-gradient(135deg,rgba(23,217,244,.17),rgba(59,130,246,.16));color:var(--primary);border-color:rgba(23,217,244,.26)}

    .episodes-card{margin-top:15px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}.episodes-card .section-title{margin-top:0}.episode-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;max-height:none;overflow:visible;padding:2px}.episode{border:1px solid var(--line);border-radius:16px;background:var(--surface-2);color:#fff;cursor:pointer;overflow:hidden;text-align:right;box-shadow:0 8px 20px rgba(0,0,0,.18);min-width:0}.episode:active{transform:scale(.985)}.episode-poster{width:100%;aspect-ratio:16/9;display:block;object-fit:cover;background:#0f172a}.episode-info{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px}.episode-name{font-size:13px;font-weight:900}.episode-play{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(23,217,244,.12);color:var(--primary);flex:0 0 30px}.episode.active{border-color:rgba(23,217,244,.55);box-shadow:0 0 0 1px rgba(23,217,244,.18),0 8px 20px rgba(0,0,0,.2)}

    .choice-modal{position:fixed;inset:0;z-index:10050;display:none;align-items:flex-end;justify-content:center;background:rgba(2,6,23,.76);backdrop-filter:blur(10px);padding:18px}.choice-modal.show{display:flex}.choice-sheet{width:min(460px,100%);background:linear-gradient(160deg,#172033,#0f172a);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:15px;box-shadow:0 28px 70px rgba(0,0,0,.5);animation:sheetUp .2s ease}.choice-top{display:flex;gap:12px;align-items:center;margin-bottom:14px}.choice-top img{width:76px;height:102px;object-fit:cover;border-radius:14px;background:#111827}.choice-copy{min-width:0}.choice-copy strong{display:block;font-size:16px;font-weight:900;line-height:1.5}.choice-copy span{display:block;color:var(--muted);font-size:13px;margin-top:4px}.choice-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice-btn{height:52px;border-radius:15px;border:1px solid var(--line);font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px}.choice-btn.watch{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#041018;border:0}.choice-btn.download{background:rgba(255,255,255,.055);color:#fff}.choice-close{width:100%;height:43px;margin-top:9px;border:0;border-radius:13px;background:transparent;color:var(--muted);font-weight:800}@keyframes sheetUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}

    body.cinema-mode{background:#000;overflow:hidden}.cinema-shell{position:fixed!important;inset:0!important;z-index:20000!important;background:#000!important;margin:0!important;padding:0!important;border-radius:0!important;width:100vw!important;height:100vh!important;display:flex!important;align-items:center!important;justify-content:center!important}.cinema-shell .player-card{width:100vw!important;height:100vh!important;border:0!important;border-radius:0!important;display:flex;align-items:center;justify-content:center}.cinema-shell .plyr,.cinema-shell video,.cinema-shell iframe{width:100%!important;height:100%!important;max-height:100vh!important;border-radius:0!important}.cinema-shell .player-actions{display:none!important}.plyr__control--overlaid{transform:translate(-50%,-50%) scale(1.12);background:rgba(12,20,32,.88)!important;border:1px solid rgba(255,255,255,.18)!important}.cinema-shell .plyr__controls{padding:18px max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))!important;background:linear-gradient(transparent,rgba(2,6,12,.88))!important}.cinema-shell .plyr__control{border-radius:12px!important}.cinema-shell .plyr__progress input[type=range]{height:5px}.cinema-shell video{object-fit:contain;background:#000}

    .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 12px}

    .loader{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(5,9,17,.82);backdrop-filter:blur(12px)}
    .spinner{width:48px;height:48px;border-radius:50%;border:4px solid rgba(23,217,244,.18);border-top-color:var(--primary);animation:spin .8s linear infinite}
    .loader span{font-size:14px;font-weight:900;color:#fff}
    @keyframes spin{to{transform:rotate(360deg)}}

    .toast{position:fixed;left:50%;bottom:24px;z-index:10000;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#111827;color:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 15px;box-shadow:var(--shadow);font-size:13px;transition:.2s;max-width:calc(100% - 32px);text-align:center}
    .toast.show{opacity:1;transform:translate(-50%,0)}

    @media(max-width:360px){.category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(min-width:560px){
      .category-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
      .media-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
      .episode-list{grid-template-columns:repeat(3,minmax(0,1fr))}
    }
    @media(min-width:900px){
      .app-shell{padding-left:24px;padding-right:24px}
      .category-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
      .media-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
      .episode-list{grid-template-columns:repeat(4,minmax(0,1fr))}
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="search-area" id="searchArea">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="searchInput" type="search" autocomplete="off" enterkeyhint="search" placeholder="ابحث في جميع المسلسلات والأفلام...">
        <button class="search-go" type="button" aria-label="بحث" onclick="executeSearch()"><i class="fa-solid fa-arrow-left"></i></button>
      </div>

      <div class="type-tabs" id="typeTabs">
        <button class="type-tab active" id="seriesTab" type="button" onclick="switchType('series')"><i class="fa-solid fa-tv"></i> مسلسلات</button>
        <button class="type-tab" id="moviesTab" type="button" onclick="switchType('movies')"><i class="fa-solid fa-film"></i> أفلام</button>
      </div>
    </div>

    <main id="homeView" class="view active">
      <div class="category-grid" id="categoryGrid"></div>
    </main>

    <main id="gridView" class="view">
      <div class="content-head">
        <button class="round-back" type="button" onclick="goBack()" aria-label="رجوع"><i class="fa-solid fa-arrow-right"></i></button>
        <h2 id="gridTitle">النتائج</h2>
      </div>
      <div class="media-grid" id="mediaGrid"></div>
      <button class="load-more" id="loadMoreBtn" type="button" onclick="loadMore()" style="display:none"><i class="fa-solid fa-rotate"></i> عرض المزيد</button>
    </main>

    <main id="detailsView" class="view">
      <div class="content-head">
        <button class="round-back" type="button" onclick="goBack()" aria-label="رجوع"><i class="fa-solid fa-arrow-right"></i></button>
        <h2>التفاصيل والمشاهدة</h2>
      </div>

      <h1 class="details-title" id="mediaTitle">...</h1>

      <section id="playerSection" style="display:none">
        <div class="player-card" id="videoContainer"></div>
        <div class="player-actions">
          <button class="action" id="prevBtn" type="button" style="display:none"><i class="fa-solid fa-backward-step"></i> السابق</button>
          <button class="action download" id="dlBtn" type="button" style="display:none"><i class="fa-solid fa-download"></i> تحميل</button>
          <button class="action" id="nextBtn" type="button" style="display:none">التالي <i class="fa-solid fa-forward-step"></i></button>
        </div>
      </section>

      <section class="episodes-card" id="episodesSection" style="display:none">
        <div class="section-title">
          <h2>الحلقات</h2>
          <span class="section-count" id="episodesCount">0 حلقة</span>
        </div>
        <div class="episode-list" id="episodesList"></div>
      </section>
    </main>
  </div>

  <div class="loader" id="loader"><div class="spinner"></div><span>جاري التحميل...</span></div>
  <div class="toast" id="toast"></div>
  <div class="choice-modal" id="episodeModal" onclick="if(event.target===this)closeEpisodeModal()">
    <div class="choice-sheet">
      <div class="choice-top">
        <img id="choicePoster" src="" alt="">
        <div class="choice-copy"><strong id="choiceTitle">الحلقة</strong><span>اختر ما تريد فعله</span></div>
      </div>
      <div class="choice-actions">
        <button class="choice-btn watch" type="button" onclick="watchChosenEpisode()"><i class="fa-solid fa-circle-play"></i> مشاهدة</button>
        <button class="choice-btn download" id="choiceDownloadBtn" type="button" onclick="downloadChosenEpisode()"><i class="fa-solid fa-download"></i> تحميل</button>
      </div>
      <button class="choice-close" type="button" onclick="closeEpisodeModal()">إلغاء</button>
    </div>
  </div>

  <script>
    const API_URL = "https://series.albesriali03.workers.dev/";

    const CATEGORY_DATA = {
      series: [
        {title:'أجنبية', icon:'fa-earth-americas', url:'https://akwam.it/series?section=30'},
        {title:'عربية', icon:'fa-language', url:'https://akwam.it/series?section=29'},
        {title:'تركية', icon:'fa-moon', url:'https://akwam.it/series?section=32'},
        {title:'آسيوية', icon:'fa-yin-yang', url:'https://akwam.it/series?section=33'},
        {title:'أنمي', icon:'fa-dragon', url:'https://akwam.it/series?category=30'},
        {title:'رمضان', icon:'fa-star-and-crescent', url:'https://akwam.it/series?category=87'}
      ],
      movies: [
        {title:'أجنبية', icon:'fa-earth-americas', url:'https://akwam.it/movies?section=30'},
        {title:'عربية', icon:'fa-language', url:'https://akwam.it/movies?section=29'},
        {title:'هندية', icon:'fa-gopuram', url:'https://akwam.it/movies?section=31'},
        {title:'آسيوية', icon:'fa-yin-yang', url:'https://akwam.it/movies?section=33'},
        {title:'تركية', icon:'fa-moon', url:'https://akwam.it/movies?section=32'},
        {title:'أنمي', icon:'fa-dragon', url:'https://akwam.it/movies?category=30'}
      ]
    };

    let activeType = 'series';
    let currentGenreUrl = '';
    let currentPage = 1;
    let isSearching = false;
    let currentView = 'homeView';
    let globalEpisodes = [];
    let currentEpisodeNum = -1;
    let playerInstance = null;
    let hlsInstance = null;
    let currentDownloadUrl = '';
    let currentPoster = '';
    let currentMediaTitle = '';
    let chosenEpisode = null;

    function renderCategories(){
      const data = CATEGORY_DATA[activeType];
      const grid = document.getElementById('categoryGrid');
      grid.innerHTML = '';
      data.forEach(item => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'category-card';
        const iconHtml = `<i class="fa-solid ${item.icon}"></i>`;
        card.innerHTML = `<span class="cat-icon">${iconHtml}</span><span class="cat-copy"><strong>${item.title}</strong></span>`;
        card.onclick = () => loadGenre(item.url, `${activeType === 'series' ? 'مسلسلات' : 'أفلام'} ${item.title}`);
        grid.appendChild(card);
      });
    }

    function switchType(type){
      activeType = type;
      document.getElementById('seriesTab').classList.toggle('active', type === 'series');
      document.getElementById('moviesTab').classList.toggle('active', type === 'movies');
      if(currentView !== 'homeView') showView('homeView', false);
      renderCategories();
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function showView(viewId, push = true){
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      currentView = viewId;
      document.getElementById('searchArea').style.display = viewId === 'homeView' ? 'block' : 'none';
      if(push && history.state?.view !== viewId) history.pushState({view:viewId}, '', location.href);
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function goBack(){
      if(history.state && history.state.view !== 'homeView') history.back();
      else showView('homeView', false);
    }

    window.addEventListener('popstate', () => {
      destroyPlayer();
      if(currentView === 'detailsView' && document.getElementById('mediaGrid').children.length){
        showView('gridView', false);
      }else{
        showView('homeView', false);
      }
    });

    function destroyPlayer(){
      exitCinemaFullscreen();
      try{ if(playerInstance){playerInstance.destroy();playerInstance=null;} }catch(e){}
      try{ if(hlsInstance){hlsInstance.destroy();hlsInstance=null;} }catch(e){}
      document.getElementById('videoContainer').innerHTML='';
    }

    function toggleLoader(show){ document.getElementById('loader').style.display = show ? 'flex' : 'none'; }

    function showToast(message){
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(showToast.t);
      showToast.t = setTimeout(()=>el.classList.remove('show'),2200);
    }

    async function fetchAPI(endpoint){
      toggleLoader(true);
      try{
        const response = await fetch(API_URL + endpoint, {cache:'no-store'});
        if(!response.ok) throw new Error('HTTP '+response.status);
        const data = await response.json();
        return data;
      }catch(error){
        showToast('تعذر الاتصال. تأكد من الإنترنت ثم أعد المحاولة.');
        return null;
      }finally{
        toggleLoader(false);
      }
    }

    async function loadGenre(url, title, page = 1){
      if(page === 1){
        currentGenreUrl = url;
        currentPage = 1;
        isSearching = false;
        document.getElementById('mediaGrid').innerHTML='';
        document.getElementById('gridTitle').textContent=title;
        document.getElementById('loadMoreBtn').style.display='none';
        showView('gridView');
      }
      const data = await fetchAPI(`?action=genre&genre=${encodeURIComponent(url)}&p=${page}`);
      if(data && data.status === 'success'){
        renderCards(Array.isArray(data.data) ? data.data : []);
        document.getElementById('loadMoreBtn').style.display = data.data && data.data.length ? 'block' : 'none';
      }
    }

    async function executeSearch(){
      const query = document.getElementById('searchInput').value.trim();
      if(!query) return;
      isSearching = true;
      document.getElementById('mediaGrid').innerHTML='';
      document.getElementById('gridTitle').textContent=`نتائج البحث: ${query}`;
      document.getElementById('loadMoreBtn').style.display='none';
      showView('gridView');
      const data = await fetchAPI(`?action=search&q=${encodeURIComponent(query)}`);
      if(data && data.status === 'success') renderCards(Array.isArray(data.data) ? data.data : []);
    }

    // البحث التلقائي أثناء الكتابة بدون الحاجة إلى الضغط على Enter
    let searchTimer = null;
    let lastSearchQuery = '';
    const searchInput = document.getElementById('searchInput');

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.trim();
      clearTimeout(searchTimer);

      if(!query){
        lastSearchQuery = '';
        goHome();
        return;
      }

      // مهلة قصيرة تمنع إرسال طلب API مع كل ضغطة بسرعة شديدة
      searchTimer = setTimeout(() => {
        if(query !== lastSearchQuery){
          lastSearchQuery = query;
          executeSearch();
        }
      }, 250);
    });

    searchInput.addEventListener('keydown', e => {
      if(e.key === 'Enter'){
        e.preventDefault();
        clearTimeout(searchTimer);
        lastSearchQuery = searchInput.value.trim();
        executeSearch();
      }
    });

    function loadMore(){
      if(isSearching) return;
      currentPage += 1;
      loadGenre(currentGenreUrl, document.getElementById('gridTitle').textContent, currentPage);
    }

    function renderCards(items){
      const grid = document.getElementById('mediaGrid');
      if(!items.length && !grid.children.length){
        grid.innerHTML='<div class="empty"><i class="fa-regular fa-face-frown"></i><br><br>لا توجد نتائج حالياً.</div>';
        return;
      }
      items.forEach(item => {
        const card = document.createElement('article');
        card.className='media-item';
        const badge = item.is_series ? 'مسلسل' : 'فيلم';
        card.innerHTML=`<div class="poster-wrap"><img src="${escapeAttr(item.img || '')}" alt="${escapeAttr(item.title || '')}" loading="lazy" referrerpolicy="no-referrer"><span class="media-badge">${badge}</span></div><div class="media-title">${escapeHtml(item.title || 'بدون عنوان')}</div>`;
        card.onclick = () => getDetails(item.href, item.is_series, item.img || '', item.title || '');
        grid.appendChild(card);
      });
    }

    async function getDetails(url, isSeriesKnown = true, poster = '', knownTitle = ''){
      showView('detailsView');
      document.getElementById('mediaTitle').textContent='جاري التحميل...';
      document.getElementById('playerSection').style.display='none';
      document.getElementById('episodesSection').style.display='none';
      destroyPlayer();
      globalEpisodes=[];
      currentEpisodeNum=-1;
      if(poster) currentPoster = poster;
      if(knownTitle) currentMediaTitle = knownTitle;

      const data = await fetchAPI(`?action=series&series=${encodeURIComponent(url)}`);
      if(!data || data.status !== 'success'){
        document.getElementById('mediaTitle').textContent='تعذر تحميل التفاصيل';
        return;
      }

      currentMediaTitle = data.movie_title || currentMediaTitle || 'التفاصيل';
      document.getElementById('mediaTitle').textContent=currentMediaTitle;
      if(Array.isArray(data.episodes) && data.episodes.length){
        globalEpisodes=data.episodes;
        document.getElementById('episodesSection').style.display='block';
        document.getElementById('episodesCount').textContent=`${data.episodes.length} حلقة`;
        renderEpisodes(url, data.movie_title || '');
      }

      if(data.media_src || data.is_iframe){
        setupPlayer(data);
      }else if(!globalEpisodes.length){
        document.getElementById('playerSection').style.display='block';
        document.getElementById('videoContainer').innerHTML='<div style="aspect-ratio:16/9;display:grid;place-items:center;color:#94a3b8;padding:20px;text-align:center">الرابط غير متاح حالياً.</div>';
      }
    }

    function renderEpisodes(currentUrl, title){
      const list=document.getElementById('episodesList');
      list.innerHTML='';
      const epMatch=title.match(/الحلقة\s*(\d+)/);
      if(epMatch) currentEpisodeNum=parseInt(epMatch[1],10);

      globalEpisodes.forEach(ep => {
        const btn=document.createElement('button');
        btn.type='button';
        btn.className='episode';
        const poster = currentPoster || '';
        btn.innerHTML=`<img class="episode-poster" src="${escapeAttr(poster)}" alt="${escapeAttr(currentMediaTitle)}" loading="lazy" referrerpolicy="no-referrer"><span class="episode-info"><span class="episode-name">الحلقة ${escapeHtml(ep.num)}</span><span class="episode-play"><i class="fa-solid fa-play"></i></span></span>`;
        if(currentEpisodeNum === ep.num || (currentUrl && ep.link && currentUrl.includes(ep.link))){
          btn.classList.add('active');
          currentEpisodeNum=ep.num;
        }
        btn.onclick=()=>prepareEpisodeChoice(ep);
        list.appendChild(btn);
      });
    }

    async function prepareEpisodeChoice(ep){
      chosenEpisode={...ep, data:null};
      document.getElementById('choicePoster').src=currentPoster || '';
      document.getElementById('choiceTitle').textContent=`${currentMediaTitle || 'المسلسل'} - الحلقة ${ep.num}`;
      const modal=document.getElementById('episodeModal');
      modal.classList.add('show');
      document.getElementById('choiceDownloadBtn').style.display='none';
      const data=await fetchAPI(`?action=series&series=${encodeURIComponent(ep.link)}`);
      if(!chosenEpisode || chosenEpisode.link!==ep.link) return;
      chosenEpisode.data=data && data.status==='success' ? data : null;
      document.getElementById('choiceDownloadBtn').style.display=chosenEpisode.data?.media_src ? 'flex' : 'none';
    }

    function closeEpisodeModal(){
      document.getElementById('episodeModal').classList.remove('show');
    }

    function watchChosenEpisode(){
      if(!chosenEpisode?.data){ showToast('جاري تجهيز الحلقة، حاول بعد لحظة.'); return; }
      const ep=chosenEpisode;
      closeEpisodeModal();
      currentEpisodeNum=Number(ep.num);
      currentDownloadUrl=ep.data.media_src || '';
      document.getElementById('mediaTitle').textContent=`${currentMediaTitle} - الحلقة ${ep.num}`;
      document.getElementById('playerSection').style.display='block';
      setupPlayer(ep.data, true);
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function downloadChosenEpisode(){
      if(!chosenEpisode?.data?.media_src){ showToast('رابط الحلقة غير متوفر للتحميل.'); return; }
      currentDownloadUrl=chosenEpisode.data.media_src;
      startDownload();
    }

    function setupPlayer(data, autoFullscreen = false){
      const section=document.getElementById('playerSection');
      const container=document.getElementById('videoContainer');
      section.style.display='block';
      destroyPlayer();
      if(autoFullscreen) enterCinemaFullscreen();

      if(data.is_iframe){
        container.innerHTML=`<iframe src="${escapeAttr(data.media_src)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
      }else{
        container.innerHTML='<video id="plyrPlayer" playsinline controls></video>';
        const video=document.getElementById('plyrPlayer');
        const options={
          controls:['play-large','restart','rewind','play','fast-forward','progress','current-time','duration','mute','volume','captions','settings','pip','airplay','fullscreen'],
          settings:['quality','speed'],
          seekTime:10,
          autoplay:true,
          fullscreen:{enabled:true,fallback:true,iosNative:true}
        };
        if(String(data.media_src).includes('.m3u8') && window.Hls && Hls.isSupported()){
          hlsInstance=new Hls({enableWorker:true});
          hlsInstance.loadSource(data.media_src);
          hlsInstance.attachMedia(video);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED,()=>{
            playerInstance=new Plyr(video,options);
            playerInstance.play().catch(()=>{});
            if(autoFullscreen) setTimeout(()=>enterCinemaFullscreen(),80);
          });
        }else{
          video.src=data.media_src;
          playerInstance=new Plyr(video,options);
          playerInstance.play().catch(()=>{});
          if(autoFullscreen) setTimeout(()=>enterCinemaFullscreen(),80);
        }
      }

      currentDownloadUrl = data.media_src || '';
      const dlBtn=document.getElementById('dlBtn');
      dlBtn.style.display=currentDownloadUrl ? 'flex' : 'none';
      dlBtn.onclick=startDownload;

      const nextBtn=document.getElementById('nextBtn');
      const prevBtn=document.getElementById('prevBtn');
      nextBtn.style.display='none';
      prevBtn.style.display='none';
      if(currentEpisodeNum !== -1 && globalEpisodes.length){
        const idx=globalEpisodes.findIndex(e=>Number(e.num)===Number(currentEpisodeNum));
        if(idx>0){
          prevBtn.style.display='flex';
          prevBtn.onclick=()=>getDetails(globalEpisodes[idx-1].link,true,currentPoster,currentMediaTitle);
        }
        if(idx!==-1 && idx<globalEpisodes.length-1){
          nextBtn.style.display='flex';
          nextBtn.onclick=()=>getDetails(globalEpisodes[idx+1].link,true,currentPoster,currentMediaTitle);
        }
      }
    }

    function enterCinemaFullscreen(){
      const section=document.getElementById('playerSection');
      section.classList.add('cinema-shell');
      document.body.classList.add('cinema-mode');
      try{
        if(window.Android && typeof window.Android.enterFullscreen === 'function') window.Android.enterFullscreen();
      }catch(e){}
      try{
        const req=section.requestFullscreen || section.webkitRequestFullscreen || section.msRequestFullscreen;
        if(req) Promise.resolve(req.call(section)).catch(()=>{});
      }catch(e){}
      try{ if(screen.orientation?.lock) screen.orientation.lock('landscape').catch(()=>{}); }catch(e){}
    }

    function exitCinemaFullscreen(){
      document.getElementById('playerSection').classList.remove('cinema-shell');
      document.body.classList.remove('cinema-mode');
      try{ if(screen.orientation?.unlock) screen.orientation.unlock(); }catch(e){}
      try{
        if(window.Android && typeof window.Android.exitFullscreen === 'function') window.Android.exitFullscreen();
      }catch(e){}
    }

    document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement) exitCinemaFullscreen(); });
    document.addEventListener('webkitfullscreenchange',()=>{ if(!document.webkitFullscreenElement) exitCinemaFullscreen(); });

    function startDownload(){
      if(!currentDownloadUrl) return;
      /* دعم اختياري إذا كان التطبيق يوفّر JavaScriptInterface باسم Android */
      try{
        if(window.Android && typeof window.Android.downloadFile === 'function'){
          window.Android.downloadFile(currentDownloadUrl);
          return;
        }
      }catch(e){}

      const a=document.createElement('a');
      a.href=currentDownloadUrl;
      a.setAttribute('download','');
      a.rel='noopener';
      a.target='_self';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function escapeHtml(value){
      return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }
    function escapeAttr(value){ return escapeHtml(value); }

    document.addEventListener('keydown',e=>{ if(e.key==='Escape' && document.getElementById('episodeModal').classList.contains('show')) closeEpisodeModal(); });

    history.replaceState({view:'homeView'},'',location.href);
    renderCategories();
  </script>
</body>
</html>
