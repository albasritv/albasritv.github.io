<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مسلسلات وأفلام</title>
    
    <!-- الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- مكتبات المشغل الجديد الاحترافي (Plyr) و HLS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <style>
        /* الألوان - مظهر تطبيقات الهواتف المتقدمة */
        :root {
            --bg-color: #0B0F19; 
            --surface-color: #151C2C; 
            --primary-color: #00E5FF; 
            --accent-color: #3B82F6;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --border-radius-lg: 24px;
            --border-radius-md: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* تخصيص لون مشغل Plyr ليطابق لون الموقع */
            --plyr-color-main: #00E5FF;
            --plyr-video-background: #000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-color); color: var(--text-main); overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }

        /* شريط التطبيق العلوي */
        header {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 15px 24px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .app-title { font-size: 22px; font-weight: 900; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .app-title i { color: var(--primary-color); font-size: 26px; }
        .app-title span { background: linear-gradient(45deg, var(--primary-color), var(--accent-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .action-btn { background: var(--surface-color); border: 1px solid rgba(255,255,255,0.1); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text-main); cursor: pointer; transition: var(--transition); }
        .action-btn:hover, .action-btn:active { background: var(--primary-color); color: #000; }
        .back-btn { display: none; }

        /* شريط البحث */
        .search-wrapper { padding: 20px 24px 0; display: flex; gap: 10px; }
        .search-box {
            flex: 1; display: flex; align-items: center; background: var(--surface-color);
            border-radius: var(--border-radius-lg); padding: 5px 20px; border: 1px solid rgba(255,255,255,0.05);
            transition: var(--transition);
        }
        .search-box:focus-within { border-color: var(--primary-color); box-shadow: 0 0 15px rgba(0, 229, 255, 0.15); }
        .search-box i { color: var(--text-muted); font-size: 18px; }
        .search-box input { flex: 1; background: transparent; border: none; padding: 12px 15px; color: #fff; font-size: 16px; outline: none; }
        
        /* التحكم بالصفحات */
        .view-page { display: none; padding: 20px 24px 80px; animation: slideUp 0.4s ease-out forwards; }
        .view-page.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* العناوين */
        .section-header { display: flex; align-items: center; gap: 10px; margin: 30px 0 15px; }
        .section-header h2 { font-size: 20px; font-weight: 900; color: var(--text-main); }
        .section-header .indicator { width: 5px; height: 24px; background: var(--primary-color); border-radius: 10px; }

        /* شبكة الأقسام */
        .grid-categories { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .category-card {
            background: linear-gradient(135deg, var(--surface-color), rgba(21, 28, 44, 0.5));
            border: 1px solid rgba(255,255,255,0.05); border-radius: var(--border-radius-md);
            padding: 20px 15px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 12px; cursor: pointer; transition: var(--transition);
        }
        .category-card i { font-size: 30px; color: var(--primary-color); background: rgba(0, 229, 255, 0.1); padding: 15px; border-radius: 50%; }
        .category-card span { font-weight: 700; font-size: 15px; letter-spacing: 0.5px; }
        .category-card:active { transform: scale(0.95); border-color: var(--primary-color); }

        /* شبكة النتائج */
        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; }
        @media(min-width: 768px) { .media-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }
        
        .media-item {
            position: relative; border-radius: var(--border-radius-md); overflow: hidden;
            background: var(--surface-color); cursor: pointer; transition: var(--transition);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .media-item:active { transform: scale(0.96); }
        .media-item img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
        .media-item .overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 30px 10px 12px;
            background: linear-gradient(to top, #0B0F19 0%, transparent 100%);
        }
        .media-item .title { font-size: 13px; font-weight: 700; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .media-item .badge {
            position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
            padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 900; color: var(--primary-color); border: 1px solid rgba(0, 229, 255, 0.2);
        }

        .btn-main {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 16px; margin-top: 30px; border-radius: var(--border-radius-lg);
            background: rgba(0, 229, 255, 0.1); color: var(--primary-color); border: 1px solid rgba(0, 229, 255, 0.3);
            font-size: 16px; font-weight: 900; cursor: pointer; transition: var(--transition); outline: none;
        }
        .btn-main:active { background: var(--primary-color); color: #000; }

        /* صفحة التفاصيل والمشاهدة */
        .details-header { text-align: center; margin-bottom: 25px; }
        .details-title { font-size: 24px; font-weight: 900; color: #fff; line-height: 1.4; margin-bottom: 10px; }
        
        .episodes-container { background: var(--surface-color); border-radius: var(--border-radius-lg); padding: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .ep-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; margin-top: 15px; max-height: 350px; overflow-y: auto; padding-right: 5px; }
        .ep-list::-webkit-scrollbar { width: 5px; }
        .ep-list::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 10px; }
        
        .ep-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 14px 10px;
            border-radius: 12px; font-size: 14px; font-weight: 900; color: var(--text-main); cursor: pointer;
            transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .ep-btn i { font-size: 14px; color: var(--text-muted); }
        .ep-btn:hover { background: rgba(255,255,255,0.1); }
        .ep-btn.active { background: var(--primary-color); color: #000; border: none; box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3); }
        .ep-btn.active i { color: #000; }

        /* حاوية المشغل الجديد Plyr */
        #playerSection { display: none; margin-bottom: 30px; animation: slideUp 0.4s ease-out; }
        .player-wrapper {
            width: 100%; background: #000; border-radius: var(--border-radius-md);
            overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
        }
        /* إعدادات مشغل Plyr ليأخذ العرض بالكامل */
        .plyr { border-radius: var(--border-radius-md); font-family: 'Tajawal', sans-serif; }
        .player-wrapper iframe { width: 100%; aspect-ratio: 16/9; border: none; }

        /* أزرار التحكم أسفل المشغل */
        .player-controls { display: flex; gap: 10px; margin-top: 15px; }
        .p-btn {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 15px; border-radius: 14px; font-size: 14px; font-weight: 900; cursor: pointer;
            border: none; transition: var(--transition);
        }
        .p-btn.nav { background: var(--surface-color); color: var(--text-main); border: 1px solid rgba(255,255,255,0.1); }
        .p-btn.nav:active { background: rgba(255,255,255,0.1); }
        .p-btn.dl { background: rgba(0, 229, 255, 0.1); color: var(--primary-color); }
        .p-btn.dl:active { background: var(--primary-color); color: #000; }

        /* شاشة التحميل */
        .loading-overlay {
            position: fixed; inset: 0; background: rgba(11, 15, 25, 0.9); backdrop-filter: blur(10px);
            z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .spinner { width: 60px; height: 60px; border: 4px solid rgba(0, 229, 255, 0.2); border-top-color: var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        .loading-text { font-size: 18px; font-weight: 900; color: #fff; letter-spacing: 1px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <header>
        <div class="action-btn back-btn" id="backBtn" onclick="goBack()"><i class="fas fa-arrow-right"></i></div>
        <div class="app-title" onclick="goHome()">
            <i class="fas fa-play"></i>
            <span>مسلسلات وأفلام</span>
        </div>
        <div class="action-btn" onclick="goHome()"><i class="fas fa-home"></i></div>
    </header>

    <!-- شريط البحث -->
    <div class="search-wrapper" id="searchBar">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن مسلسل أو فيلم..." onkeydown="if(event.key === 'Enter') executeSearch()">
        </div>
    </div>

    <!-- الصفحة الرئيسية: الأقسام -->
    <main id="homeView" class="view-page active">
        
        <div class="section-header">
            <div class="indicator"></div>
            <h2>المسلسلات</h2>
        </div>
        <div class="grid-categories">
            <div class="category-card" onclick="loadGenre('https://akwam.it/series?section=30', 'مسلسلات أجنبية')">
                <i class="fas fa-globe-americas"></i><span>أجنبية</span>
            </div>
            <div class="category-card" onclick="loadGenre('https://akwam.it/series?section=29', 'مسلسلات عربية')">
                <i class="fas fa-star"></i><span>عربية</span>
            </div>
            <div class="category-card" onclick="loadGenre('https://akwam.it/series?section=32', 'مسلسلات تركية')">
                <i class="fas fa-chess-knight"></i><span>تركية</span>
            </div>
            <div class="category-card" onclick="loadGenre('https://akwam.it/series?section=33', 'مسلسلات آسيوية')">
                <i class="fas fa-fan"></i><span>آسيوية</span>
            </div>
            <div class="category-card" onclick="loadGenre('https://akwam.it/series?category=30', 'مسلسلات أنمي')">
                <i class="fas fa-dragon"></i><span>أنمي</span>
            </div>
            <div class="category-card" onclick="loadGenre('https://akwam.it/series?category=87', 'مسلسلات رمضان')">
                <i class="fas fa-moon"></i><span>رمضان</span>
            </div>
        </div>

        <div class="section-header">
            <div class="indicator"></div>
            <h2>الأفلام</h2>
        </div>
        <div class="grid-categories">
            <div class="category-card" onclick="loadGenre('https://akwam.it/movies?section=30', 'أفلام أجنبية')">
                <i class="fas fa-film"></i><span>أجنبية</span>
            </div>
            <div class="category-card" onclick="loadGenre('https://akwam.it/movies?section=29', 'أفلام عربية')">
                <i class="fas fa-theater-masks"></i><span>عربية</span>
            </div>
            <div class="category-card" onclick="loadGenre('https://akwam.it/movies?section=31', 'أفلام هندية')">
                <i class="fas fa-motorcycle"></i><span>هندية</span>
            </div>
            <div class="category-card" onclick="loadGenre('https://akwam.it/movies?section=33', 'أفلام آسيوية')">
                <i class="fas fa-yin-yang"></i><span>آسيوية</span>
            </div>
            <div class="category-card" onclick="loadGenre('https://akwam.it/movies?section=32', 'أفلام تركية')">
                <i class="fas fa-crown"></i><span>تركية</span>
            </div>
            <div class="category-card" onclick="loadGenre('https://akwam.it/movies?category=30', 'أفلام أنمي')">
                <i class="fas fa-fire"></i><span>أنمي</span>
            </div>
        </div>
    </main>

    <!-- صفحة قائمة النتائج -->
    <main id="gridView" class="view-page">
        <div class="section-header">
            <div class="indicator"></div>
            <h2 id="gridTitle">النتائج</h2>
        </div>
        <div class="media-grid" id="mediaGrid"></div>
        <button class="btn-main" id="loadMoreBtn" onclick="loadMore()" style="display: none;">
            <i class="fas fa-sync-alt"></i> عرض المزيد
        </button>
    </main>

    <!-- صفحة تفاصيل العمل والمشاهدة -->
    <main id="detailsView" class="view-page">
        <div class="details-header">
            <h2 class="details-title" id="mediaTitle">...</h2>
        </div>

        <!-- منطقة المشغل -->
        <div id="playerSection">
            <div class="player-wrapper" id="videoContainer"></div>
            
            <div class="player-controls">
                <button class="p-btn nav" id="nextBtn" style="display: none;"><i class="fas fa-step-forward"></i> التالي</button>
                <a class="p-btn dl" id="dlBtn" href="#" target="_blank" style="display: none;"><i class="fas fa-download"></i> تحميل</a>
                <button class="p-btn nav" id="prevBtn" style="display: none;">السابق <i class="fas fa-step-backward"></i></button>
            </div>
        </div>

        <!-- منطقة الحلقات -->
        <div class="episodes-container" id="episodesSection" style="display: none;">
            <div class="section-header" style="margin-top: 0;">
                <div class="indicator"></div>
                <h2>الحلقات</h2>
            </div>
            <div class="ep-list" id="episodesList"></div>
        </div>
    </main>

    <!-- شاشة التحميل -->
    <div class="loading-overlay" id="loader">
        <div class="spinner"></div>
        <div class="loading-text">جاري المعالجة...</div>
    </div>

    <script>
        const API_URL = "https://series.albesriali03.workers.dev/";

        let currentGenreUrl = "";
        let currentPage = 1;
        let isSearching = false;
        
        let globalEpisodes = [];
        let currentEpisodeNum = -1;
        
        // متغيرات المشغل الجديد Plyr و HLS
        let playerInstance = null;
        let hlsInstance = null;

        function showView(viewId) {
            document.querySelectorAll('.view-page').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            
            const backBtn = document.getElementById('backBtn');
            const searchBar = document.getElementById('searchBar');
            
            if (viewId === 'homeView') {
                backBtn.style.display = 'none';
                searchBar.style.display = 'flex';
            } else {
                backBtn.style.display = 'flex';
                searchBar.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function destroyPlayer() {
            if (playerInstance) { playerInstance.destroy(); playerInstance = null; }
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            document.getElementById('videoContainer').innerHTML = "";
        }

        function goHome() { 
            destroyPlayer();
            showView('homeView'); 
        }
        
        function goBack() { 
            if(document.getElementById('detailsView').classList.contains('active') && document.getElementById('mediaGrid').innerHTML !== "") {
                destroyPlayer();
                showView('gridView');
            } else {
                goHome();
            }
        }

        function toggleLoader(show) {
            document.getElementById('loader').style.display = show ? 'flex' : 'none';
        }

        async function fetchAPI(endpoint) {
            toggleLoader(true);
            try {
                const response = await fetch(API_URL + endpoint);
                const data = await response.json();
                toggleLoader(false);
                return data;
            } catch (error) {
                toggleLoader(false);
                alert("تأكد من اتصالك بالإنترنت.");
                return null;
            }
        }

        async function loadGenre(url, title, page = 1) {
            if (page === 1) {
                currentGenreUrl = url;
                currentPage = 1;
                isSearching = false;
                document.getElementById('mediaGrid').innerHTML = "";
                document.getElementById('gridTitle').innerText = title;
                showView('gridView');
            }
            const data = await fetchAPI(`?action=genre&genre=${encodeURIComponent(url)}&p=${page}`);
            if (data && data.status === "success") {
                renderCards(data.data);
                document.getElementById('loadMoreBtn').style.display = data.data.length > 0 ? "flex" : "none";
            }
        }

        async function executeSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            isSearching = true;
            document.getElementById('mediaGrid').innerHTML = "";
            document.getElementById('gridTitle').innerText = `بحث: ${query}`;
            document.getElementById('loadMoreBtn').style.display = "none";
            showView('gridView');

            const data = await fetchAPI(`?action=search&q=${encodeURIComponent(query)}`);
            if (data && data.status === "success") renderCards(data.data);
        }

        function loadMore() {
            if (!isSearching) {
                currentPage++;
                loadGenre(currentGenreUrl, document.getElementById('gridTitle').innerText, currentPage);
            }
        }

        function renderCards(items) {
            const grid = document.getElementById('mediaGrid');
            if(items.length === 0 && grid.innerHTML === "") {
                grid.innerHTML = "<div style='grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;'>لا توجد نتائج.</div>";
                return;
            }

            items.forEach(item => {
                const badge = item.is_series ? "مسلسل" : "فيلم";
                const card = document.createElement('div');
                card.className = "media-item";
                card.onclick = () => getDetails(item.href, item.is_series);
                
                card.innerHTML = `
                    <div class="badge"><i class="fas ${item.is_series ? 'fa-tv' : 'fa-film'}"></i> ${badge}</div>
                    <img src="${item.img}" alt="${item.title}" loading="lazy">
                    <div class="overlay">
                        <div class="title">${item.title}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function getDetails(url, isSeriesKnown = true) {
            showView('detailsView');
            document.getElementById('mediaTitle').innerText = "جاري التحميل...";
            document.getElementById('playerSection').style.display = "none";
            document.getElementById('episodesSection').style.display = "none";
            
            destroyPlayer();

            const data = await fetchAPI(`?action=series&series=${encodeURIComponent(url)}`);
            
            if (data && data.status === "success") {
                document.getElementById('mediaTitle').innerText = data.movie_title;
                
                if (data.episodes && data.episodes.length > 0) {
                    globalEpisodes = data.episodes;
                    document.getElementById('episodesSection').style.display = "block";
                    renderEpisodes(url, data.movie_title);
                }

                if (data.media_src || data.is_iframe) {
                    setupPlayer(data);
                } else if (!data.episodes || data.episodes.length === 0) {
                    document.getElementById('playerSection').style.display = "block";
                    document.getElementById('videoContainer').innerHTML = `<div style="display:flex; height:100%; aspect-ratio:16/9; align-items:center; justify-content:center; color:#999;">الرابط غير متاح حالياً.</div>`;
                }
            } else {
                document.getElementById('mediaTitle').innerText = "حدث خطأ!";
            }
        }

        function renderEpisodes(currentUrl, title) {
            const list = document.getElementById('episodesList');
            list.innerHTML = "";
            currentEpisodeNum = -1;

            const epMatch = title.match(/الحلقة\s*(\d+)/);
            if (epMatch) currentEpisodeNum = parseInt(epMatch[1]);

            globalEpisodes.forEach((ep) => {
                const btn = document.createElement('div');
                btn.className = "ep-btn";
                btn.innerHTML = `<i class="fas fa-play"></i> حلقة ${ep.num}`;
                
                if (currentEpisodeNum === ep.num || currentUrl.includes(ep.link)) {
                    btn.classList.add('active');
                    currentEpisodeNum = ep.num;
                }
                
                btn.onclick = () => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    getDetails(ep.link, true); 
                };
                list.appendChild(btn);
            });
        }

        function setupPlayer(data) {
            document.getElementById('playerSection').style.display = "block";
            const container = document.getElementById('videoContainer');
            destroyPlayer(); // تأكيد إيقاف أي مشغل سابق

            // إعداد المشغل الاحترافي (Plyr)
            if (data.is_iframe) {
                container.innerHTML = `<iframe src="${data.media_src}" allowfullscreen></iframe>`;
            } else {
                container.innerHTML = `<video id="plyrPlayer" playsinline controls></video>`;
                const video = document.getElementById('plyrPlayer');

                const plyrOptions = {
                    controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
                    settings: ['quality', 'speed'],
                    seekTime: 10
                };

                if (data.media_src.includes('.m3u8') && Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(data.media_src);
                    hlsInstance.attachMedia(video);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
                        playerInstance = new Plyr(video, plyrOptions);
                        playerInstance.play();
                    });
                } else {
                    video.src = data.media_src;
                    playerInstance = new Plyr(video, plyrOptions);
                    playerInstance.play();
                }
            }

            // زر التحميل
            const dlBtn = document.getElementById('dlBtn');
            if (data.download_src) {
                dlBtn.href = data.download_src;
                dlBtn.style.display = "flex";
            } else {
                dlBtn.style.display = "none";
            }

            // أزرار التنقل
            const nextBtn = document.getElementById('nextBtn');
            const prevBtn = document.getElementById('prevBtn');
            nextBtn.style.display = "none";
            prevBtn.style.display = "none";

            if (currentEpisodeNum !== -1 && globalEpisodes.length > 0) {
                const idx = globalEpisodes.findIndex(e => e.num === currentEpisodeNum);
                if (idx > 0) {
                    prevBtn.style.display = "flex";
                    prevBtn.onclick = () => getDetails(globalEpisodes[idx - 1].link, true);
                }
                if (idx !== -1 && idx < globalEpisodes.length - 1) {
                    nextBtn.style.display = "flex";
                    nextBtn.onclick = () => getDetails(globalEpisodes[idx + 1].link, true);
                }
            }
        }
    </script>
</body>
</html>
